<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="DVD: přednáška o sociální dedukci, skrytých rolích a skrytém pohybu. Most mezi počítačovými a deskovými hrami.">
  <title>Tajemství ve hře · DVD</title>
  <link rel="stylesheet" href="presentation.css?v=20261005e">
  <script src="slides.js?v=20261005e" defer></script>
  <script src="presentation.js?v=20261005e" defer></script>
<style id="grafit-lecture-return-style">
.grafit-lecture-return{box-sizing:border-box;display:inline-flex;align-items:center;justify-content:center;flex:none;min-height:44px;padding:8px 12px;border:1px solid var(--line,#b6c3ca);border-radius:5px;background:var(--paper,#fcfbf8);color:var(--ink,#203039);font:600 14px/1.2 "Segoe UI",Arial,sans-serif;text-decoration:none;white-space:nowrap;cursor:pointer}
.grafit-lecture-return:hover{background:var(--panel,#e8eff1)}
.grafit-lecture-return:focus-visible{outline:3px solid var(--accent,#245d72);outline-offset:3px}
.grafit-lecture-return--floating{position:fixed;top:max(10px,env(safe-area-inset-top));left:max(12px,env(safe-area-inset-left));z-index:60;background:#fcfbf8;color:#203039;border-color:#b6c3ca;box-shadow:0 2px 10px #0002}
body.grafit-toolbar-return.presenting{grid-template-rows:auto minmax(0,1fr) 70px}
body.grafit-toolbar-return:has(#viewport){grid-template-rows:auto minmax(0,1fr) 50px}
body.grafit-toolbar-return:has(#page-canvas){display:grid;height:100dvh;grid-template-rows:auto minmax(0,1fr) 70px;overflow:hidden}
.grafit-toolbar-return:has(#page-canvas) .deck{height:auto;min-height:0}
.grafit-toolbar-return:has(#page-canvas) .page{max-height:calc(100% - 24px)}
.grafit-toolbar-return .toolbar{display:flex;height:auto;min-height:76px;flex-wrap:wrap;padding-block:10px;gap:12px}
.grafit-toolbar-return .toolbar nav{flex-wrap:wrap}
@media(max-width:1100px){.grafit-toolbar-return .toolbar #chapter{display:none}}
@media(max-width:760px){.grafit-toolbar-return .toolbar{padding:10px 12px;min-height:65px}.grafit-toolbar-return .toolbar nav{width:100%;margin:0;gap:5px}.grafit-toolbar-return .toolbar .brand{font-size:17px}.grafit-toolbar-return .toolbar .variant-switch{flex-wrap:wrap}.grafit-toolbar-return.presenting{grid-template-rows:auto minmax(0,1fr) 64px}}
@media print{.grafit-lecture-return{display:none!important}body.grafit-toolbar-return:has(#page-canvas){display:block;height:auto;overflow:visible}}
</style>
</head>
<body class="grafit-toolbar-return">
  <header class="toolbar">
<a id="grafit-lecture-return" class="grafit-lecture-return" href="../../" aria-label="Zpět na přehled přednášek GRAFIT">← Zpět na přehled</a>
    <a class="brand" href="#slide-1" aria-label="DVD, první snímek">DVD<span> / Tajemství ve hře</span></a>
    <nav aria-label="Ovládání prezentace">
      <button id="contents" title="Obsah (O)">Obsah</button>
      <button id="notes-toggle" title="Poznámky (N)" aria-pressed="false">Poznámky</button>
      <button id="reading" title="Režim čtení (R)" aria-pressed="false">Čtení</button>
      <button id="fullscreen" title="Celá obrazovka (F)">Celá obrazovka</button>
    </nav>
  </header>
  <main id="viewport" aria-label="Přednáškové snímky"><div id="deck"></div></main>
  <footer class="controls">
    <span id="chapter">Úvod</span>
    <span class="hint">← → snímky &nbsp; N poznámky &nbsp; O obsah &nbsp; F celá obrazovka</span>
    <div class="pager"><button id="previous" aria-label="Předchozí snímek">←</button><output id="counter" aria-live="polite">01 / 72</output><button id="next" aria-label="Další snímek">→</button></div>
    <div class="progress" aria-hidden="true"><div id="progress-value"></div></div>
  </footer>
  <aside id="notes-panel" aria-label="Poznámky pro vyučujícího" hidden>
    <div class="drawer-head"><strong>Poznámky pro vyučujícího</strong><button id="notes-close" aria-label="Zavřít poznámky">×</button></div>
    <h2 id="notes-title"></h2><p id="notes-text"></p><div id="notes-sources"></div>
  </aside>
  <dialog id="overview"><div class="dialog-head"><h2>Obsah přednášky</h2><button class="close" aria-label="Zavřít obsah">×</button></div><nav aria-label="Seznam snímků"></nav></dialog>
  <dialog id="image-view"><button class="close" aria-label="Zavřít obrázek">×</button><img alt="Zvětšený obrázek"></dialog>
  <div class="sr-only" id="announcement" role="status"></div>
  <noscript><p class="noscript">Prezentace potřebuje povolený JavaScript. Všechny soubory a obrázky jsou součástí lokálního balíku.</p></noscript>
</body>
</html>
