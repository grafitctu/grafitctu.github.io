<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 540" role="img" aria-labelledby="title desc">
 <title id="title">Hierarchie znalosti: hráči, hra a orákulum</title>
 <desc id="desc">Ve vnější množině orákula je množina informací hry. V ní se překrývají tři kruhy hráčů A, B a C. Bod 1 je společný všem, 2 jen B a C, 3 jen B, 4 zná pouze hra, 5 představuje informaci budoucí náhody.</desc>
 <ellipse cx="430" cy="270" rx="416" ry="252" fill="#ece4d8" stroke="#9c8a72" stroke-width="2.5"/>
 <ellipse cx="420" cy="310" rx="345" ry="196" fill="#f5f1e8" stroke="#142538" stroke-width="3"/>
 <g stroke-width="3">
  <circle cx="420" cy="242" r="118" fill="#41829c" fill-opacity=".15" stroke="#326d84"/>
  <circle cx="343" cy="352" r="118" fill="#b85021" fill-opacity=".15" stroke="#b85021"/>
  <circle cx="497" cy="352" r="118" fill="#608650" fill-opacity=".15" stroke="#527746"/>
 </g>
 <g font-family="Segoe UI,Arial,sans-serif" text-anchor="middle" fill="#142538">
  <text x="430" y="64" font-size="27" font-weight="650">Orákulum</text>
  <text x="420" y="103" font-size="22" fill="#526175">i budoucí výsledek náhody</text>
  <text x="184" y="226" font-size="26" font-weight="650">Hra</text>
  <text x="420" y="204" font-size="27" font-weight="650" fill="#326d84">Hráč A</text>
  <text x="303" y="319" font-size="27" font-weight="650" fill="#b85021">Hráč B</text>
  <text x="550" y="319" font-size="27" font-weight="650" fill="#527746">Hráč C</text>
 </g>
 <g fill="#142538" stroke="#f5f1e8" stroke-width="3">
  <circle cx="420" cy="311" r="19"/><circle cx="420" cy="407" r="19"/>
  <circle cx="281" cy="374" r="19"/><circle cx="645" cy="234" r="19"/>
  <circle cx="715" cy="128" r="19"/>
 </g>
 <g fill="#fff" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="700" text-anchor="middle" dominant-baseline="central">
  <text x="420" y="311">1</text><text x="420" y="407">2</text><text x="281" y="374">3</text><text x="645" y="234">4</text><text x="715" y="128">5</text>
 </g>
</svg>
