<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1420 450" role="img" aria-labelledby="title desc">
 <title id="title">Čtyři hráči a pět pozorovaných setkání v čase</title>
 <desc id="desc">Čtyři vodorovné linky A, B, C a D. V 02:10 A vidí D ve strojovně. V 02:11 C vidí B ve skladu. V 02:12 jsou A a C spolu na palubě. V 02:13 C vidí, jak D zabijí vlci na břehu. V 02:14 A a C ve strojovně zjistí, že chybí palivo. B od 02:12 nemá přímého svědka. Šipky jdou od svědka k pozorovanému hráči.</desc>
 <defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1 9 5 1 9" fill="none" stroke="#142538" stroke-width="1.5"/></marker>
 </defs>
 <g font-family="Segoe UI,Arial,sans-serif" text-anchor="middle">
  <g font-size="24" font-weight="650" fill="#b85021">
   <text x="260" y="25">02:10</text><text x="505" y="25">02:11</text><text x="750" y="25">02:12</text><text x="995" y="25">02:13</text><text x="1240" y="25">02:14</text>
  </g>
  <g font-size="25" fill="#142538">
   <text x="260" y="62">Strojovna</text><text x="260" y="93">A vidí D</text>
   <text x="505" y="62">Sklad</text><text x="505" y="93">C vidí B</text>
   <text x="750" y="62">Paluba</text><text x="750" y="93">A a C spolu</text>
   <text x="995" y="62">Břeh · vlci</text><text x="995" y="93">C vidí smrt D</text>
   <text x="1240" y="62">Strojovna · A a C</text><text x="1240" y="93">Chybí palivo</text>
  </g>
 </g>
 <g stroke="#d7d7d0" stroke-width="1" stroke-dasharray="3 7">
  <path d="M260 111V378M505 111V378M750 111V378M995 111V378M1240 111V378"/>
 </g>
 <g stroke="#aab6bf" stroke-width="3" fill="none">
  <path d="M110 140H1380M110 215H1380M110 290H1380M110 365H995"/>
 </g>
 <g font-family="Segoe UI,Arial,sans-serif" font-size="33" font-weight="700" text-anchor="middle">
  <text x="54" y="151" fill="#326d84">A</text><text x="54" y="226" fill="#b85021">B</text>
  <text x="54" y="301" fill="#527746">C</text><text x="54" y="376" fill="#745585">D</text>
 </g>
 <!-- Only dots at the endpoints denote an observation; crossed lanes do not. -->
 <g stroke="#142538" stroke-width="3" fill="none" marker-end="url(#arrow)">
  <path d="M260 154V346"/>
  <path d="M505 276V234"/>
  <path d="M995 304V345"/>
 </g>
 <g stroke="#142538" stroke-width="3" fill="none" marker-start="url(#arrow)" marker-end="url(#arrow)">
  <path d="M750 157V273"/><path d="M1240 157V273"/>
 </g>
 <g fill="#326d84" stroke="#f5f1e8" stroke-width="3"><circle cx="260" cy="140" r="10"/><circle cx="750" cy="140" r="10"/><circle cx="1240" cy="140" r="10"/></g>
 <g fill="#b85021" stroke="#f5f1e8" stroke-width="3"><circle cx="505" cy="215" r="10"/></g>
 <g fill="#527746" stroke="#f5f1e8" stroke-width="3"><circle cx="505" cy="290" r="10"/><circle cx="750" cy="290" r="10"/><circle cx="995" cy="290" r="10"/><circle cx="1240" cy="290" r="10"/></g>
 <g fill="#745585" stroke="#f5f1e8" stroke-width="3"><circle cx="260" cy="365" r="10"/></g>
 <path d="M660 215H1380" stroke="#b85021" stroke-width="4" stroke-dasharray="9 8"/>
 <rect x="792" y="195" width="370" height="40" fill="#f5f1e8"/>
 <text x="977" y="222" font-family="Segoe UI,Arial,sans-serif" font-size="24" text-anchor="middle" fill="#b85021">B: v tomto úseku bez svědka</text>
 <circle cx="995" cy="365" r="14" fill="#f5f1e8"/>
 <path d="M985 355 1005 375M1005 355 985 375" stroke="#b85021" stroke-width="4"/>
 <text x="1080" y="373" font-family="Segoe UI,Arial,sans-serif" font-size="23" fill="#526175">D dál nejedná</text>
 <g font-family="Segoe UI,Arial,sans-serif" font-size="22" fill="#526175">
  <text x="110" y="429">Šipka: svědek → pozorovaný hráč. Body jsou setkání; celou trasu mezi nimi neznáme.</text>
 </g>
</svg>
