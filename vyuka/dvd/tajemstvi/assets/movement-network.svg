<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 610" role="img" aria-labelledby="title desc">
<title id="title">Síť pro demonstraci skrytého pohybu</title>
<desc id="desc">Oranžové plné taxi spoje A–B, A–C, B–D, C–E, D–F, E–F. Modré přerušované autobusové spoje A–D, B–E, C–F. Spoje jsou obousměrné. Křížení není stanice.</desc>
<g fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="9">
 <g stroke="#b85021"><path d="M160 170 L520 100 L880 170 L880 440 L520 510 L160 440 Z"/></g>
 <g stroke="#28718d" stroke-dasharray="19 13"><path d="M160 170 H880 M520 100 V510 M160 440 H880"/></g>
</g>
<g fill="#f5f1e8" stroke="#142538" stroke-width="4">
 <circle cx="160" cy="170" r="39"/><circle cx="520" cy="100" r="39"/><circle cx="160" cy="440" r="39"/>
 <circle cx="880" cy="170" r="39"/><circle cx="520" cy="510" r="39"/><circle cx="880" cy="440" r="39"/>
</g>
<g fill="#142538" font-family="Segoe UI,Arial,sans-serif" font-weight="700" font-size="37" text-anchor="middle" dominant-baseline="central">
 <text x="160" y="170">A</text><text x="520" y="100">B</text><text x="160" y="440">C</text>
 <text x="880" y="170">D</text><text x="520" y="510">E</text><text x="880" y="440">F</text>
</g>
<g font-family="Segoe UI,Arial,sans-serif" font-size="28" fill="#142538">
 <path d="M270 580 H335" stroke="#b85021" stroke-width="9"/><text x="355" y="589">Taxi</text>
 <path d="M590 580 H655" stroke="#28718d" stroke-width="9" stroke-dasharray="19 13"/><text x="675" y="589">Autobus</text>
</g>
</svg>
