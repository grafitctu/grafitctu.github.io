<!doctype html><html lang="cs"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Jak roste prostorový strom</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:12px;font:16px/1.45 system-ui;color:#223743;background:#fbfaf7}main{max-width:1200px;margin:auto}nav{display:flex;flex-wrap:wrap;gap:.4rem}button{font:inherit;border:1px solid #728b90;background:white;color:inherit;padding:.4em .9em;border-radius:.35em;cursor:pointer}button[aria-pressed=true]{background:#165e60;color:white}p{margin:.5em 0}label{display:inline-flex;align-items:center;gap:.6em}section{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:.8em}figure{margin:.6em 0 0;min-width:0}figcaption{font-weight:bold}.pane{background:white;border:1px solid #a8bbc0;overflow:auto}.pane svg{display:block}#scene{width:100%;cursor:crosshair;touch-action:manipulation}#tree{width:100%}.branch{stroke:#94a8a8;fill:none}.node{cursor:pointer}.node rect{fill:white;stroke:#265960}.node[data-leaf=true] rect{fill:#dcf0eb}.node.active rect,.node:focus rect{fill:#ffdb94;stroke:#9b5100;stroke-width:2}svg text{font:11px system-ui;fill:#21373c}.cut{stroke:#397274;fill:none}.point{fill:#184a62}#stats{font-variant-numeric:tabular-nums}@media(max-width:650px){section{grid-template-columns:1fr}}
</style><main><nav aria-label="Typ struktury"><button data-mode="quad" aria-pressed="true">Quadtree</button><button data-mode="kd" aria-pressed="false">k-d strom</button><button data-mode="bvh" aria-pressed="false">BVH</button></nav>
<p id="hint"></p><label><span id="caplabel">Maximální počet bodů na list</span><input id="cap" type="range" min="1" max="8" value="2"><output for="cap">2</output></label>
<section><figure><figcaption id="sceneTitle">Prostor</figcaption><div class="pane"><svg id="scene" viewBox="0 0 400 240" tabindex="0" role="group" aria-labelledby="sceneTitle"></svg></div></figure>
<figure><figcaption>Strom (dendrogram)</figcaption><div class="pane"><svg id="tree" aria-label="Uzly a listy od kořene dolů"></svg></div></figure></section>
<p id="stats" aria-live="polite"></p><small>Číslo v listu je počet prvků. Najeď na uzel stromu nebo jej vyber tabulátorem: vlevo se zvýrazní jeho oblast a prvky. Pro přidání bez myši zaměř obrázek, posuň kříž šipkami a stiskni Enter.</small>
</main><script src="tree.js"></script></html>
