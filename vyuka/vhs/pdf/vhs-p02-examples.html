<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>VHS · Modalita: příklady</title>
  <link rel="stylesheet" href="vhs-viewer.css">
  <script type="module" src="vhs-viewer.js" defer></script>
<style id="grafit-lecture-return-style">
.grafit-lecture-return,.grafit-course-link--floating{box-sizing:border-box;display:inline-flex;align-items:center;justify-content:center;flex:none;min-height:44px;padding:8px 12px;border:1px solid var(--line,#b6c3ca);border-radius:5px;background:var(--paper,#fcfbf8);color:var(--ink,#203039);font:600 14px/1.2 "Segoe UI",Arial,sans-serif;text-decoration:none;white-space:nowrap;cursor:pointer}
.grafit-lecture-return:hover,.grafit-course-link--floating:hover{background:var(--panel,#e8eff1)}
.grafit-lecture-return:focus-visible,#grafit-course-link:focus-visible{outline:3px solid var(--accent,#245d72);outline-offset:3px}
.grafit-lecture-return--floating,.grafit-course-link--floating{position:fixed;top:max(10px,env(safe-area-inset-top));left:max(12px,env(safe-area-inset-left));z-index:60;background:#fcfbf8;color:#203039;border-color:#b6c3ca;box-shadow:0 2px 10px #0002}
#grafit-course-link.brand{display:inline-flex;align-items:center;min-height:44px} .grafit-course-link--floating{left:168px}
body.grafit-toolbar-return.presenting{grid-template-rows:auto minmax(0,1fr) 70px}
body.grafit-toolbar-return:has(#viewport){grid-template-rows:auto minmax(0,1fr) 50px}
body.grafit-toolbar-return:has(#page-canvas){display:grid;height:100dvh;grid-template-rows:auto minmax(0,1fr) 70px;overflow:hidden}
.grafit-toolbar-return:has(#page-canvas) .deck{height:auto;min-height:0}
.grafit-toolbar-return:has(#page-canvas) .page{max-height:calc(100% - 24px)}
.grafit-toolbar-return .toolbar{display:flex;height:auto;min-height:76px;flex-wrap:wrap;padding-block:10px;gap:12px}
.grafit-toolbar-return .toolbar nav{flex-wrap:wrap}
@media(max-width:1100px){.grafit-toolbar-return .toolbar #chapter{display:none}}
@media(max-width:760px){.grafit-toolbar-return .toolbar{padding:10px 12px;min-height:65px}.grafit-toolbar-return .toolbar nav{width:100%;margin:0;gap:5px}.grafit-toolbar-return .toolbar .brand{font-size:17px}.grafit-toolbar-return .toolbar .variant-switch{flex-wrap:wrap}.grafit-toolbar-return.presenting{grid-template-rows:auto minmax(0,1fr) 64px}}
@media print{.grafit-lecture-return,#grafit-course-link{display:none!important}body.grafit-toolbar-return:has(#page-canvas){display:block;height:auto;overflow:visible}}
</style>
</head>
<body data-pdf="vhs-p02-examples.pdf" data-pages="11" data-title="Modalita: příklady" class="grafit-toolbar-return">
  <header class="toolbar">
<a id="grafit-lecture-return" class="grafit-lecture-return" href="../../" aria-label="Zpět na přehled přednášek GRAFIT">← Zpět na přehled</a>
    <a class="brand" id="grafit-course-link" href="../" aria-label="Přehled přednášek VHS">VHS <span>/ přednáška</span></a>
    <span id="chapter" class="title">Modalita: příklady</span>
    <nav aria-label="Nástroje prezentace">
      <button id="contents" aria-haspopup="dialog">Obsah</button>
      <a class="pdf-link" href="vhs-p02-examples.pdf" download>PDF</a>
      <button id="theme" class="theme" aria-label="Tmavý režim" aria-pressed="false" title="Tmavý režim">◐</button>
      <button id="fullscreen" aria-label="Celá obrazovka (F)">⛶</button>
    </nav>
  </header>
  <main class="deck" aria-label="Modalita: příklady">
    <div id="page" class="page" role="img" aria-label="Načítá se snímek">
      <canvas id="page-canvas"></canvas>
      <div id="loading" class="loading"><span class="spinner" aria-hidden="true"></span><span>Načítám přednášku…</span></div>
      <div id="error" class="empty" hidden><h1>Přednášku se nepodařilo načíst</h1><p id="error-detail"></p><p><a href="vhs-p02-examples.pdf">Otevřít PDF přímo</a></p></div>
    </div>
  </main>
  <footer class="controls">
    <span class="hint">← → <span>listování</span> · F <span>celá obrazovka</span></span>
    <div class="pager"><button id="previous" aria-label="Předchozí snímek">←</button><output id="counter">01 / 11</output><button id="next" aria-label="Další snímek">→</button></div>
    <span class="credit">Radek Richtr · FIT ČVUT</span>
    <div class="progress" aria-hidden="true"><div id="progress-value" class="progress-value"></div></div>
  </footer>
  <div id="announcement" class="sr-only" aria-live="polite" aria-atomic="true"></div>
  <dialog id="overview" aria-labelledby="overview-title">
    <div class="dialog-heading"><h2 id="overview-title">Obsah přednášky</h2><button class="close" aria-label="Zavřít obsah">✕</button></div>
    <nav aria-label="Všechny snímky"><button type="button" data-page="1"><span class="slide-no">01</span><span>Snímek 1</span></button><button type="button" data-page="2"><span class="slide-no">02</span><span>Snímek 2</span></button><button type="button" data-page="3"><span class="slide-no">03</span><span>Snímek 3</span></button><button type="button" data-page="4"><span class="slide-no">04</span><span>Snímek 4</span></button><button type="button" data-page="5"><span class="slide-no">05</span><span>Snímek 5</span></button><button type="button" data-page="6"><span class="slide-no">06</span><span>Snímek 6</span></button><button type="button" data-page="7"><span class="slide-no">07</span><span>Snímek 7</span></button><button type="button" data-page="8"><span class="slide-no">08</span><span>Snímek 8</span></button><button type="button" data-page="9"><span class="slide-no">09</span><span>Snímek 9</span></button><button type="button" data-page="10"><span class="slide-no">10</span><span>Snímek 10</span></button><button type="button" data-page="11"><span class="slide-no">11</span><span>Snímek 11</span></button></nav>
  </dialog>
</body>
</html>
