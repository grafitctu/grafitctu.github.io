<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 100 1100 433" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f4f7fb" />
      <stop offset="100%" stop-color="#e8eef6" />
    </linearGradient>

    <!-- Header Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>

    <!-- Soft Card Shadow -->
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.06" />
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.04" />
    </filter>

    <!-- Arrow Marker Teal -->
    <marker id="arrowTeal" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 2 L 8 5 L 1 8" fill="none" stroke="#0d9488" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    </marker>

    <style>
      .title { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; font-size: 32px; fill: #0f172a; }
      .tag { font-family: 'Courier New', Courier, monospace; font-size: 11px; font-weight: 700; letter-spacing: 1px; fill: #2563eb; }
      
      .top-card-text { font-family: system-ui, -apple-system, sans-serif; font-weight: 600; font-size: 15px; fill: #334155; }
      .card-title { font-family: system-ui, -apple-system, sans-serif; font-weight: 600; font-size: 16px; fill: #1e293b; }
      .card-subtext { font-family: system-ui, -apple-system, sans-serif; font-weight: 500; font-size: 13px; fill: #64748b; }
      
      /* Pills */
      .pill-text-teal { font-family: 'Courier New', Courier, monospace; font-weight: 700; font-size: 12px; fill: #0f766e; }
      .pill-text-orange { font-family: 'Courier New', Courier, monospace; font-weight: 700; font-size: 12px; fill: #c2410c; }
      .pill-text-purple { font-family: 'Courier New', Courier, monospace; font-weight: 700; font-size: 12px; fill: #6d28d9; }
      
      /* Connectors */
      .connector { fill: none; stroke: #0d9488; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <!-- Background -->
  <!-- <rect width="100%" height="100%" fill="url(#bgGrad)" /> -->

  <!-- LEVEL 1: Main Categories -->
  <g transform="translate(50, 115)">
    <!-- Magnetické -->
    <g transform="translate(0, 0)">
      <rect width="180" height="50" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#cardShadow)" />
      <text x="90" y="31" class="top-card-text" text-anchor="middle">Magnetické</text>
    </g>
    
    <!-- Inerciální -->
    <g transform="translate(200, 0)">
      <rect width="180" height="50" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#cardShadow)" />
      <text x="90" y="31" class="top-card-text" text-anchor="middle">Inerciální</text>
    </g>

    <!-- Ultrazvukové -->
    <g transform="translate(400, 0)">
      <rect width="180" height="50" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#cardShadow)" />
      <text x="90" y="31" class="top-card-text" text-anchor="middle">Ultrazvukové</text>
    </g>

    <!-- Optické -->
    <g transform="translate(600, 0)">
      <rect width="180" height="50" rx="8" fill="#ffffff" stroke="#0d9488" stroke-width="2" filter="url(#cardShadow)" />
      <text x="90" y="31" class="top-card-text" fill="#0f766e" font-weight="700" text-anchor="middle">Optické</text>
    </g>

    <!-- Mechanické -->
    <g transform="translate(800, 0)">
      <rect width="180" height="50" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#cardShadow)" />
      <text x="90" y="31" class="top-card-text" text-anchor="middle">Mechanické</text>
    </g>
  </g>

  <!-- Arrow from Optické to Level 2 -->
  <path d="M 690, 165 L 690, 215" class="connector" marker-end="url(#arrowTeal)" />

  <!-- LEVEL 2: Optické Subcategories -->
  <!-- Level 2 Branch Line -->
  <path d="M 235, 220 L 915, 220" stroke="#0d9488" stroke-width="2" fill="none" />
  <path d="M 235, 220 L 235, 245" class="connector" marker-end="url(#arrowTeal)" />
  <path d="M 575, 220 L 575, 245" class="connector" marker-end="url(#arrowTeal)" />
  <path d="M 915, 220 L 915, 245" class="connector" marker-end="url(#arrowTeal)" />

  <g transform="translate(50, 245)">
    <!-- Specializované -->
    <g transform="translate(70, 0)">
      <rect width="230" height="70" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#cardShadow)" />
      <!-- Pill -->
      <!-- <rect x="50" y="20" width="130" height="30" rx="6" fill="#ccfbf1" /> -->
      <text x="115" y="40" class="top-card-text" text-anchor="middle">Specializované</text>
    </g>

    <!-- Pomocí markeru -->
    <g transform="translate(410, 0)">
      <rect width="230" height="70" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#cardShadow)" />
      <!-- Pill -->
      <!-- <rect x="40" y="20" width="150" height="30" rx="6" fill="#ffedd5" /> -->
      <text x="115" y="40" class="top-card-text" text-anchor="middle">Pomocí markeru</text>
    </g>

    <!-- Bez markeru -->
    <g transform="translate(750, 0)">
      <rect width="230" height="70" rx="10" fill="#ffffff" stroke="#0d9488" stroke-width="2" filter="url(#cardShadow)" />
      <!-- Pill -->
      <!-- <rect x="50" y="20" width="130" height="30" rx="6" fill="#f3e8ff" /> -->
      <text x="115" y="40" class="top-card-text" text-anchor="middle">Bez markeru</text>
    </g>
  </g>

  <!-- Arrow from Bez markeru to Level 3 -->
  <path d="M 915, 315 L 915, 375" class="connector" marker-end="url(#arrowTeal)" />

  <!-- LEVEL 3: Bez markeru Methods -->
  <!-- Level 3 Branch Line -->
  <path d="M 215, 380 L 915, 380" stroke="#0d9488" stroke-width="2" fill="none" />
  <path d="M 215, 380 L 215, 410" class="connector" marker-end="url(#arrowTeal)" />
  <path d="M 565, 380 L 565, 410" class="connector" marker-end="url(#arrowTeal)" />
  <path d="M 915, 380 L 915, 410" class="connector" marker-end="url(#arrowTeal)" />

  <g transform="translate(50, 410)">
    <!-- Detekce hran -->
    <g transform="translate(20, 0)">
      <rect width="290" height="90" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#cardShadow)" />
      <text x="145" y="42" class="card-title" text-anchor="middle">Detekce hran</text>
      <text x="145" y="65" class="card-subtext" text-anchor="middle">Vyhledávání kontur a geometrií</text>
    </g>

    <!-- Porovnání se šablonou -->
    <g transform="translate(370, 0)">
      <rect width="290" height="90" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#cardShadow)" />
      <text x="145" y="42" class="card-title" text-anchor="middle">Porovnání se šablonou</text>
      <text x="145" y="65" class="card-subtext" text-anchor="middle">Template Matching / 2D a 3D vzory</text>
    </g>

    <!-- Významné body -->
    <g transform="translate(720, 0)">
      <rect width="290" height="90" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#cardShadow)" />
      <text x="145" y="42" class="card-title" text-anchor="middle">Významné body</text>
      <text x="145" y="65" class="card-subtext" text-anchor="middle">Feature Points (SIFT, SURF, ORB)</text>
    </g>
  </g>

  
</svg>