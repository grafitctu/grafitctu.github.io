<!doctype html><html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Segmentace mozaiky krok za krokem | GRAFIT</title><meta name="description" content="13 krátkých snímků: K-means, blur, barva, lokální statistiky a segmentace textur. Kód v Pythonu a měřené výsledky."><link rel="stylesheet" href="slides.css"></head><body><header><a class="brand" id="back" href="../">← Přehled ROZ</a><span class="grow"></span><button id="previous" aria-label="Previous slide">←</button><select id="slide-select" aria-label="Slide"></select><button id="next" aria-label="Next slide">→</button><button id="all" aria-pressed="false">Čtení / snímky</button><button id="print">Tisk / PDF</button><button id="language" aria-label="Switch language">EN</button></header><main></main><footer id="hint"></footer><noscript>Pro prezentaci zapněte JavaScript. Enable JavaScript to view the slides.</noscript><script type="application/json" id="deck-data">{"cs": [["Segmentace mozaiky krok za krokem", "<p>Krátká ukázka, jak měnit příznaky a základní metody.<\/p><div class=\"images\"><figure><a href=\"assets/tm18_2_2-source.png\" target=\"_blank\" rel=\"noopener\"><img src=\"assets/tm18_2_2-source.png\" width=\"512\" height=\"512\" alt=\"Vstupní obraz: tm18_2_2.png\"><\/a><figcaption>Vstupní obraz<\/figcaption><\/figure><figure><a href=\"assets/tm18_2_2-ground_truth.png\" target=\"_blank\" rel=\"noopener\"><img src=\"assets/tm18_2_2-ground_truth.png\" width=\"512\" height=\"512\" alt=\"Referenční segmentace (GT): tm18_2_2.png\"><\/a><figcaption>Referenční segmentace (GT)<\/figcaption><\/figure><figure><a href=\"assets/tm18_2_2-09_gradients_vote.png\" target=\"_blank\" rel=\"noopener\"><img src=\"assets/tm18_2_2-09_gradients_vote.png\" width=\"512\" height=\"512\" alt=\"Výsledek metody 09: tm18_2_2.png\"><\/a><figcaption>Výsledek metody 09<\/figcaption><\/figure><\/div><p>Python, K-means a 10 variant. Stejný obraz v každém kroku, kód a skutečně naměřené výsledky.<\/p><p><small>ROZ · GRAFIT · 12. 11. 2026. Ilustrativní mozaika tm18_2_2, K = 6. Vybraná pro srozumitelnou ukázku, nereprezentuje průměr celé sady.<\/small><\/p>"], ["Společný základ: K-means", "<div class=\"columns\"><div><pre><code>flat = feat.reshape(-1, feat.shape[-1])\nrng = np.random.default_rng(20261112)\nselected = rng.choice(len(flat), 8192, replace=False)\nmodel = KMeans(\n    n_clusters=k, init=&quot;k-means++&quot;, n_init=5,\n    max_iter=100, random_state=20261112,\n    algorithm=&quot;lloyd&quot;\n).fit(flat[selected])\nlabels = model.predict(flat).reshape(512, 512)<\/code><\/pre><\/div><div><p>Každý pixel popisuje příznakový vektor <code>feat[y, x]<\/code>. K-means najde K center a přiřadí každému pixelu nejbližší centrum.<\/p><p>Centra učíme na 8 192 pixelech. Klasifikujeme všech 512 × 512 pixelů. Stejný seed a pět inicializací držíme pro všechny varianty.<\/p><p><strong>Vstup:<\/strong> RGB a známé K ze zadání. GT používáme až pro hodnocení a sjednocení barev ve vizualizaci.<\/p><p><small>Nová výuková implementace v Pythonu. Není to bitově shodný původní C++ Segmenter 18. Zkrácené výřezy kódu předpokládají uvedené pomocné funkce.<\/small><\/p><\/div><\/div>"], ["00 · Jen červený kanál", "<div class=\"columns\"><div><pre><code>a = np.asarray(rgb, dtype=np.float32) / 255\nfeat = a[:, :, :1]<\/code><\/pre><p>Jeden pixel, jedno číslo R. Metoda nevidí zelenou, modrou ani okolí. Podobná červená hodnota může patřit různým texturám. <strong>Otázka:<\/strong> které oblasti se slévají?<\/p><\/div><div><div class=\"images\"><figure><a href=\"assets/tm18_2_2-source.png\" target=\"_blank\" rel=\"noopener\"><img src=\"assets/tm18_2_2-source.png\" width=\"512\" height=\"512\" alt=\"Vstup: tm18_2_2.png\"><\/a><figcaption>Vstup<\/figcaption><\/figure><figure><a href=\"assets/tm18_2_2-ground_truth.png\" target=\"_blank\" rel=\"noopener\"><img src=\"assets/tm18_2_2-ground_truth.png\" width=\"512\" height=\"512\" alt=\"GT: tm18_2_2.png\"><\/a><figcaption>GT<\/figcaption><\/figure><figure><a href=\"assets/tm18_2_2-00_R_pixel.png\" target=\"_blank\" rel=\"noopener\"><img src=\"assets/tm18_2_2-00_R_pixel.png\" width=\"512\" height=\"512\" alt=\"00 · CA 24.2 %: tm18_2_2.png\"><\/a><figcaption>00 · CA 24.2 %<\/figcaption><\/figure><\/div><p><strong>Průměr 80 obrázků:<\/strong> 00: CS 1.33 %, CA 24.21 %<\/p><\/div><\/div>"], ["01 · Gaussovo vyhlazení", "<div class=\"columns\"><div><pre><code>def blur(a, sigma):\n    return gaussian_filter(\n        a, sigma=(sigma, sigma, 0),\n        mode=&quot;reflect&quot;, truncate=3\n    )\n\nfeat = blur(a[:, :, :1], 5)<\/code><\/pre><p>Průměrujeme okolí s Gaussovými vahami, σ = 5 pixelů. Poslední nula zachovává oddělené kanály. Ubyde drobných změn uvnitř textury, ale rozmažou se také hranice.<\/p><\/div><div><div class=\"images\"><figure><a href=\"assets/tm18_2_2-source.png\" target=\"_blank\" rel=\"noopener\"><img src=\"assets/tm18_2_2-source.png\" width=\"512\" height=\"512\" alt=\"Vstup: tm18_2_2.png\"><\/a><figcaption>Vstup<\/figcaption><\/figure><figure><a href=\"assets/tm18_2_2-ground_truth.png\" target=\"_blank\" rel=\"noopener\"><img src=\"assets/tm18_2_2-ground_truth.png\" width=\"512\" height=\"512\" alt=\"GT: tm18_2_2.png\"><\/a><figcaption>GT<\/figcaption><\/figure><figure><a href=\"assets/tm18_2_2-00_R_pixel.png\" target=\"_blank\" rel=\"noopener\"><img src=\"assets/tm18_2_2-00_R_pixel.png\" width=\"512\" height=\"512\" alt=\"00 · CA 24.2 %: tm18_2_2.png\"><\/a><figcaption>00 · CA 24.2 %<\/figcaption><\/figure><figure><a href=\"assets/tm18_2_2-01_R_blur.png\" target=\"_blank\" rel=\"noopener\"><img src=\"assets/tm18_2_2-01_R_blur.png\" width=\"512\" height=\"512\" alt=\"01 · CA 31.1 %: tm18_2_2.png\"><\/a><figcaption>01 · CA 31.1 %<\/figcaption><\/figure><\/div><p><strong>Průměr 80 obrázků:<\/strong> 00: CS 1.33 %, CA 24.21 %; 01: CS 2.51 %, CA 27.80 %<\/p><\/div><\/div>"], ["02–03 · RGB a CIELAB", "<div class=\"columns\"><div><pre><code># 02: three colour channels\nfeat = blur(a, 5)\n\n# 03: lightness and chromatic coordinates\nlab = rgb2lab(a, illuminant=&quot;D65&quot;)\nlab = lab.astype(np.float32) / 100\nfeat = blur(lab, 5)<\/code><\/pre><p>RGB dává tři příznaky místo jednoho. CIELAB mění geometrii barevných vzdáleností a odděluje světlost L* od a*, b*. Počet příznaků zůstává 3. Obě varianty mají stejný blur.<\/p><\/div><div><div class=\"images\"><figure><a href=\"assets/tm18_2_2-source.png\" target=\"_blank\" rel=\"noopener\"><img src=\"assets/tm18_2_2-source.png\" width=\"512\" height=\"512\" alt=\"Vstup: tm18_2_2.png\"><\/a><figcaption>Vstup<\/figcaption><\/figure><figure><a href=\"assets/tm18_2_2-ground_truth.png\" target=\"_blank\" rel=\"noopener\"><img src=\"assets/tm18_2_2-ground_truth.png\" width=\"512\" height=\"512\" alt=\"GT: tm18_2_2.png\"><\/a><figcaption>GT<\/figcaption><\/figure><figure><a href=\"assets/tm18_2_2-02_RGB_blur.png\" target=\"_blank\" rel=\"noopener\"><img src=\"assets/tm18_2_2-02_RGB_blur.png\" width=\"512\" height=\"512\" alt=\"02 · CA 42.2 %: tm18_2_2.png\"><\/a><figcaption>02 · CA 42.2 %<\/figcaption><\/figure><figure><a href=\"assets/tm18_2_2-03_Lab_blur.png\" target=\"_blank\" rel=\"noopener\"><img src=\"assets/tm18_2_2-03_Lab_blur.png\" width=\"512\" height=\"512\" alt=\"03 · CA 56.5 %: tm18_2_2.png\"><\/a><figcaption>03 · CA 56.5 %<\/figcaption><\/figure><\/div><p><strong>Průměr 80 obrázků:<\/strong> 02: CS 8.41 %, CA 35.57 %; 03: CS 16.62 %, CA 44.61 %<\/p><\/div><\/div>"], ["04 · Lokální průměr a odchylka", "<div class=\"columns\"><div><pre><code>def local_stats(a, sigma):\n    mean = blur(a, sigma)\n    var = blur(a * a, sigma) - mean * mean\n    std = np.sqrt(np.maximum(var, 0))\n    return np.concatenate([mean, std], axis=-1)\n\nfeat = local_stats(lab, 5)<\/code><\/pre><p>Tři průměry popisují barvu, tři odchylky proměnlivost v okolí. Máme 6 příznaků. <code>maximum(var, 0)<\/code> ošetřuje zápornou odchylku výpočtu vzniklou zaokrouhlením. Stejná průměrná barva už nemusí znamenat stejnou texturu.<\/p><\/div><div><div class=\"images\"><figure><a href=\"assets/tm18_2_2-source.png\" target=\"_blank\" rel=\"noopener\"><img src=\"assets/tm18_2_2-source.png\" width=\"512\" height=\"512\" alt=\"Vstup: tm18_2_2.png\"><\/a><figcaption>Vstup<\/figcaption><\/figure><figure><a href=\"assets/tm18_2_2-ground_truth.png\" target=\"_blank\" rel=\"noopener\"><img src=\"assets/tm18_2_2-ground_truth.png\" width=\"512\" height=\"512\" alt=\"GT: tm18_2_2.png\"><\/a><figcaption>GT<\/figcaption><\/figure><figure><a href=\"assets/tm18_2_2-03_Lab_blur.png\" target=\"_blank\" rel=\"noopener\"><img src=\"assets/tm18_2_2-03_Lab_blur.png\" width=\"512\" height=\"512\" alt=\"03 · CA 56.5 %: tm18_2_2.png\"><\/a><figcaption>03 · CA 56.5 %<\/figcaption><\/figure><figure><a href=\"assets/tm18_2_2-04_Lab_std.png\" target=\"_blank\" rel=\"noopener\"><img src=\"assets/tm18_2_2-04_Lab_std.png\" width=\"512\" height=\"512\" alt=\"04 · CA 60.6 %: tm18_2_2.png\"><\/a><figcaption>04 · CA 60.6 %<\/figcaption><\/figure><\/div><p><strong>Průměr 80 obrázků:<\/strong> 03: CS 16.62 %, CA 44.61 %; 04: CS 19.40 %, CA 46.83 %<\/p><\/div><\/div>"], ["05 · Standardizace příznaků", "<div class=\"columns\"><div><pre><code>sample = flat[selected]\nmean = sample.mean(axis=0)\nscale = np.maximum(sample.std(axis=0), 0.01)\nflat = (flat - mean) / scale\nsample = flat[selected]<\/code><\/pre><p>Příznaky dostanou srovnatelná měřítka v eukleidovské vzdálenosti. Průměr a odchylku odhadujeme ze vzorku vstupního obrazu, bez GT. Může ale vzrůst i vliv méně užitečného příznaku.<\/p><\/div><div><div class=\"images\"><figure><a href=\"assets/tm18_2_2-source.png\" target=\"_blank\" rel=\"noopener\"><img src=\"assets/tm18_2_2-source.png\" width=\"512\" height=\"512\" alt=\"Vstup: tm18_2_2.png\"><\/a><figcaption>Vstup<\/figcaption><\/figure><figure><a href=\"assets/tm18_2_2-ground_truth.png\" target=\"_blank\" rel=\"noopener\"><img src=\"assets/tm18_2_2-ground_truth.png\" width=\"512\" height=\"512\" alt=\"GT: tm18_2_2.png\"><\/a><figcaption>GT<\/figcaption><\/figure><figure><a href=\"assets/tm18_2_2-04_Lab_std.png\" target=\"_blank\" rel=\"noopener\"><img src=\"assets/tm18_2_2-04_Lab_std.png\" width=\"512\" height=\"512\" alt=\"04 · CA 60.6 %: tm18_2_2.png\"><\/a><figcaption>04 · CA 60.6 %<\/figcaption><\/figure><figure><a href=\"assets/tm18_2_2-05_Lab_std_scaled.png\" target=\"_blank\" rel=\"noopener\"><img src=\"assets/tm18_2_2-05_Lab_std_scaled.png\" width=\"512\" height=\"512\" alt=\"05 · CA 66.1 %: tm18_2_2.png\"><\/a><figcaption>05 · CA 66.1 %<\/figcaption><\/figure><\/div><p><strong>Průměr 80 obrázků:<\/strong> 04: CS 19.40 %, CA 46.83 %; 05: CS 20.67 %, CA 48.51 %<\/p><\/div><\/div>"], ["06 · Dvě velikosti okolí", "<div class=\"columns\"><div><pre><code>feat = np.concatenate(\n    [local_stats(lab, s) for s in (3, 9)],\n    axis=-1\n)\n# Then standardise and run the same K-means.<\/code><\/pre><p>Šest statistik pro σ = 3 a šest pro σ = 9 dává 12 příznaků. Menší okolí zachytí jemnější strukturu, větší stabilnější charakter textury. Cena: více výpočtů a širší přechody u hranic.<\/p><\/div><div><div class=\"images\"><figure><a href=\"assets/tm18_2_2-source.png\" target=\"_blank\" rel=\"noopener\"><img src=\"assets/tm18_2_2-source.png\" width=\"512\" height=\"512\" alt=\"Vstup: tm18_2_2.png\"><\/a><figcaption>Vstup<\/figcaption><\/figure><figure><a href=\"assets/tm18_2_2-ground_truth.png\" target=\"_blank\" rel=\"noopener\"><img src=\"assets/tm18_2_2-ground_truth.png\" width=\"512\" height=\"512\" alt=\"GT: tm18_2_2.png\"><\/a><figcaption>GT<\/figcaption><\/figure><figure><a href=\"assets/tm18_2_2-05_Lab_std_scaled.png\" target=\"_blank\" rel=\"noopener\"><img src=\"assets/tm18_2_2-05_Lab_std_scaled.png\" width=\"512\" height=\"512\" alt=\"05 · CA 66.1 %: tm18_2_2.png\"><\/a><figcaption>05 · CA 66.1 %<\/figcaption><\/figure><figure><a href=\"assets/tm18_2_2-06_multiscale.png\" target=\"_blank\" rel=\"noopener\"><img src=\"assets/tm18_2_2-06_multiscale.png\" width=\"512\" height=\"512\" alt=\"06 · CA 68.9 %: tm18_2_2.png\"><\/a><figcaption>06 · CA 68.9 %<\/figcaption><\/figure><\/div><p><strong>Průměr 80 obrázků:<\/strong> 05: CS 20.67 %, CA 48.51 %; 06: CS 21.76 %, CA 50.40 %<\/p><\/div><\/div>"], ["07 · Hlasování okolí", "<div class=\"columns\"><div><pre><code>votes = np.stack([\n    gaussian_filter(\n        (labels == c).astype(np.float32),\n        3, mode=&quot;reflect&quot;, truncate=3\n    ) for c in range(k)\n])\nlabels = np.argmax(votes, axis=0)<\/code><\/pre><p>Každá třída hlasuje přes svou binární masku, σ = 3. Vyhraje největší lokální podpora. ID tříd nemají číselné pořadí: jejich přímé průměrování nedává smysl. Hlasování může odstranit malé ostrůvky i správné tenké oblasti.<\/p><\/div><div><div class=\"images\"><figure><a href=\"assets/tm18_2_2-source.png\" target=\"_blank\" rel=\"noopener\"><img src=\"assets/tm18_2_2-source.png\" width=\"512\" height=\"512\" alt=\"Vstup: tm18_2_2.png\"><\/a><figcaption>Vstup<\/figcaption><\/figure><figure><a href=\"assets/tm18_2_2-ground_truth.png\" target=\"_blank\" rel=\"noopener\"><img src=\"assets/tm18_2_2-ground_truth.png\" width=\"512\" height=\"512\" alt=\"GT: tm18_2_2.png\"><\/a><figcaption>GT<\/figcaption><\/figure><figure><a href=\"assets/tm18_2_2-06_multiscale.png\" target=\"_blank\" rel=\"noopener\"><img src=\"assets/tm18_2_2-06_multiscale.png\" width=\"512\" height=\"512\" alt=\"06 · CA 68.9 %: tm18_2_2.png\"><\/a><figcaption>06 · CA 68.9 %<\/figcaption><\/figure><figure><a href=\"assets/tm18_2_2-07_multiscale_vote.png\" target=\"_blank\" rel=\"noopener\"><img src=\"assets/tm18_2_2-07_multiscale_vote.png\" width=\"512\" height=\"512\" alt=\"07 · CA 69.9 %: tm18_2_2.png\"><\/a><figcaption>07 · CA 69.9 %<\/figcaption><\/figure><\/div><p><strong>Průměr 80 obrázků:<\/strong> 06: CS 21.76 %, CA 50.40 %; 07: CS 22.26 %, CA 50.97 %<\/p><\/div><\/div>"], ["08–09 · Směrové změny jasu", "<div class=\"columns\"><div><pre><code>light = lab[:, :, 0]\ndx = sobel(light, axis=1, mode=&quot;reflect&quot;) / 8\ndy = sobel(light, axis=0, mode=&quot;reflect&quot;) / 8\nenergy = np.stack([dx * dx, dy * dy], axis=-1)\nfeat = np.concatenate(\n    [feat, np.sqrt(blur(energy, 5))], axis=-1\n)<\/code><\/pre><p>K 12 příznakům varianty 06 přidáme dvě lokální energie gradientu. Následuje standardizace. Varianta 08 nemá hlasování, 09 jej přidává. <strong>Férová srovnání:<\/strong> 06 s 08 pro příznaky, 08 s 09 pro hlasování.<\/p><\/div><div><div class=\"images\"><figure><a href=\"assets/tm18_2_2-source.png\" target=\"_blank\" rel=\"noopener\"><img src=\"assets/tm18_2_2-source.png\" width=\"512\" height=\"512\" alt=\"Vstup: tm18_2_2.png\"><\/a><figcaption>Vstup<\/figcaption><\/figure><figure><a href=\"assets/tm18_2_2-ground_truth.png\" target=\"_blank\" rel=\"noopener\"><img src=\"assets/tm18_2_2-ground_truth.png\" width=\"512\" height=\"512\" alt=\"GT: tm18_2_2.png\"><\/a><figcaption>GT<\/figcaption><\/figure><figure><a href=\"assets/tm18_2_2-08_gradients.png\" target=\"_blank\" rel=\"noopener\"><img src=\"assets/tm18_2_2-08_gradients.png\" width=\"512\" height=\"512\" alt=\"08 · CA 68.5 %: tm18_2_2.png\"><\/a><figcaption>08 · CA 68.5 %<\/figcaption><\/figure><figure><a href=\"assets/tm18_2_2-09_gradients_vote.png\" target=\"_blank\" rel=\"noopener\"><img src=\"assets/tm18_2_2-09_gradients_vote.png\" width=\"512\" height=\"512\" alt=\"09 · CA 69.8 %: tm18_2_2.png\"><\/a><figcaption>09 · CA 69.8 %<\/figcaption><\/figure><\/div><p><strong>Průměr 80 obrázků:<\/strong> 08: CS 22.01 %, CA 50.98 %; 09: CS 22.40 %, CA 51.58 %<\/p><\/div><\/div>"], ["Výsledky všech variant", "<table><thead><tr><th>Varianta<\/th><th>CS % ↑<\/th><th>CA % ↑<\/th><th>OS % ↓<\/th><th>US % ↓<\/th><th>ARI ↑<\/th><th>VI bit ↓<\/th><\/tr><\/thead><tbody><tr><th>00_R_pixel<\/th><td>1.33<\/td><td>24.21<\/td><td>0.00<\/td><td>1.04<\/td><td>0.135<\/td><td>4.047<\/td><\/tr><tr><th>01_R_blur<\/th><td>2.51<\/td><td>27.80<\/td><td>1.94<\/td><td>1.39<\/td><td>0.178<\/td><td>3.747<\/td><\/tr><tr><th>02_RGB_blur<\/th><td>8.41<\/td><td>35.57<\/td><td>4.46<\/td><td>0.80<\/td><td>0.275<\/td><td>3.177<\/td><\/tr><tr><th>03_Lab_blur<\/th><td>16.62<\/td><td>44.61<\/td><td>7.93<\/td><td>2.68<\/td><td>0.387<\/td><td>2.528<\/td><\/tr><tr><th>04_Lab_std<\/th><td>19.40<\/td><td>46.83<\/td><td>7.77<\/td><td>4.34<\/td><td>0.423<\/td><td>2.373<\/td><\/tr><tr><th>05_Lab_std_scaled<\/th><td>20.67<\/td><td>48.51<\/td><td>8.01<\/td><td>7.10<\/td><td>0.451<\/td><td>2.307<\/td><\/tr><tr><th>06_multiscale<\/th><td>21.76<\/td><td>50.40<\/td><td>9.34<\/td><td>7.13<\/td><td>0.476<\/td><td>2.170<\/td><\/tr><tr><th>07_multiscale_vote<\/th><td>22.26<\/td><td>50.97<\/td><td>9.55<\/td><td>7.78<\/td><td>0.484<\/td><td>2.119<\/td><\/tr><tr><th>08_gradients<\/th><td>22.01<\/td><td>50.98<\/td><td>7.94<\/td><td>6.23<\/td><td>0.481<\/td><td>2.176<\/td><\/tr><tr><th>09_gradients_vote<\/th><td>22.40<\/td><td>51.58<\/td><td>7.98<\/td><td>6.85<\/td><td>0.489<\/td><td>2.124<\/td><\/tr><\/tbody><\/table><p><small>Průměr přes 80 obrázků. CS počítá průniky s oboustranným pokrytím alespoň 75 %. CA je průměr IoU vážený plochou GT po párování tříd s maximálním průnikem. OS / US značí přerozdělení / sloučení oblastí a mohou být nulové i u špatné segmentace. ARI je shoda dvojic pixelů s korekcí na náhodu. VI je informační rozdíl rozdělení.<\/small><\/p>"], ["Složitější metoda nemusí pomoci", "<div class=\"images\"><figure><a href=\"assets/tm2_2_2-source.png\" target=\"_blank\" rel=\"noopener\"><img src=\"assets/tm2_2_2-source.png\" width=\"512\" height=\"512\" alt=\"tm2_2_2: tm2_2_2.png\"><\/a><figcaption>tm2_2_2<\/figcaption><\/figure><figure><a href=\"assets/tm2_2_2-ground_truth.png\" target=\"_blank\" rel=\"noopener\"><img src=\"assets/tm2_2_2-ground_truth.png\" width=\"512\" height=\"512\" alt=\"GT: tm2_2_2.png\"><\/a><figcaption>GT<\/figcaption><\/figure><figure><a href=\"assets/tm2_2_2-04_Lab_std.png\" target=\"_blank\" rel=\"noopener\"><img src=\"assets/tm2_2_2-04_Lab_std.png\" width=\"512\" height=\"512\" alt=\"04 · CS 74.69 %: tm2_2_2.png\"><\/a><figcaption>04 · CS 74.69 %<\/figcaption><\/figure><figure><a href=\"assets/tm2_2_2-05_Lab_std_scaled.png\" target=\"_blank\" rel=\"noopener\"><img src=\"assets/tm2_2_2-05_Lab_std_scaled.png\" width=\"512\" height=\"512\" alt=\"05 · CS 0.00 %: tm2_2_2.png\"><\/a><figcaption>05 · CS 0.00 %<\/figcaption><\/figure><\/div><p><strong>Standardizace 04 → 05:<\/strong> na vývojových 16 obrázcích CS klesá z 13.66 % na 10.27 %, přestože celkový průměr roste. Nahoře je výrazný konkrétní neúspěch.<\/p><p><small>Skupiny 1, 6, 11, 16 tvoří vývojovou sadu, ostatních 64 obrázků odkládáme. Varianty i parametry byly pevné před prvním skórováním. Vývojové CS i CA postupně rostou pouze v řadě 00–04. Textury se mohou opakovat, proto nejde o nezávislý test nových textur.<\/small><\/p>"], ["Vlastní pokus", "<pre><code>python -m pip install -r requirements.txt\npython segment.py input.png seg.png --k 6 \\\n    --method 04_Lab_std<\/code><\/pre><p>Změňte jedinou věc: kanál, σ, příznak nebo hlasování. Nejdřív napište předpoklad, pak porovnejte výsledek s rodičovskou variantou. Zaznamenejte i obrázky, které se zhoršily. Při vlastním ladění používejte vývojovou sadu.<\/p><p><a href=\"source.zip\" download>Zdrojový kód ZIP<\/a> · <a href=\"segment.py\" download>segment.py<\/a> · <a href=\"summary.csv\" download>Výsledky CSV<\/a> · <a href=\"offline.zip\" download>Prezentace offline<\/a> · <a href=\"https://roz-mosaic.richtrad.chatgpt.site\">Mosaic: vyhodnocení<\/a><\/p><p><small>Příklad příkazu používá pokračování řádku pro Bash; ve Windows ho napište na jeden řádek. K musí odpovídat zadání pro daný obraz. Výstup je PNG s ID tříd; obarvený náhled slouží jen pro zobrazení.<\/small><\/p><p><small>Dokumentace: <a href=\"https://scikit-learn.org/stable/modules/generated/sklearn.cluster.KMeans.html\">KMeans<\/a> · <a href=\"https://docs.scipy.org/doc/scipy/reference/generated/scipy.ndimage.gaussian_filter.html\">gaussian_filter<\/a> · <a href=\"https://scikit-image.org/docs/stable/api/skimage.color.html#skimage.color.rgb2lab\">rgb2lab<\/a><\/small><\/p>"]], "en": [["Mosaic segmentation step by step", "<p>A short demonstration of feature design and basic segmentation methods.<\/p><div class=\"images\"><figure><a href=\"assets/tm18_2_2-source.png\" target=\"_blank\" rel=\"noopener\"><img src=\"assets/tm18_2_2-source.png\" width=\"512\" height=\"512\" alt=\"Input image: tm18_2_2.png\"><\/a><figcaption>Input image<\/figcaption><\/figure><figure><a href=\"assets/tm18_2_2-ground_truth.png\" target=\"_blank\" rel=\"noopener\"><img src=\"assets/tm18_2_2-ground_truth.png\" width=\"512\" height=\"512\" alt=\"Ground truth (GT): tm18_2_2.png\"><\/a><figcaption>Ground truth (GT)<\/figcaption><\/figure><figure><a href=\"assets/tm18_2_2-09_gradients_vote.png\" target=\"_blank\" rel=\"noopener\"><img src=\"assets/tm18_2_2-09_gradients_vote.png\" width=\"512\" height=\"512\" alt=\"Method 09 output: tm18_2_2.png\"><\/a><figcaption>Method 09 output<\/figcaption><\/figure><\/div><p>Python, K-means and 10 variants. The same image at each step, code and measured results.<\/p><p><small>ROZ · GRAFIT · 12 November 2026. Illustrative mosaic tm18_2_2, K = 6. Chosen for a clear demonstration, not as an average case.<\/small><\/p>"], ["Shared baseline: K-means", "<div class=\"columns\"><div><pre><code>flat = feat.reshape(-1, feat.shape[-1])\nrng = np.random.default_rng(20261112)\nselected = rng.choice(len(flat), 8192, replace=False)\nmodel = KMeans(\n    n_clusters=k, init=&quot;k-means++&quot;, n_init=5,\n    max_iter=100, random_state=20261112,\n    algorithm=&quot;lloyd&quot;\n).fit(flat[selected])\nlabels = model.predict(flat).reshape(512, 512)<\/code><\/pre><\/div><div><p>Each pixel has a feature vector <code>feat[y, x]<\/code>. K-means finds K centres and assigns each pixel to the nearest one.<\/p><p>We fit centres on 8,192 pixels and classify all 512 × 512 pixels. Every variant uses the same seed and five initialisations.<\/p><p><strong>Input:<\/strong> RGB and the known K supplied by the assignment. GT is only used for evaluation and consistent visualisation colours.<\/p><p><small>A new teaching implementation in Python, not a bitwise reproduction of the original C++ Segmenter 18. Short code excerpts assume the helper functions shown here.<\/small><\/p><\/div><\/div>"], ["00 · Red channel only", "<div class=\"columns\"><div><pre><code>a = np.asarray(rgb, dtype=np.float32) / 255\nfeat = a[:, :, :1]<\/code><\/pre><p>One pixel, one R value. The method cannot see green, blue or neighbouring pixels. Similar red values may belong to different textures. <strong>Question:<\/strong> which regions merge?<\/p><\/div><div><div class=\"images\"><figure><a href=\"assets/tm18_2_2-source.png\" target=\"_blank\" rel=\"noopener\"><img src=\"assets/tm18_2_2-source.png\" width=\"512\" height=\"512\" alt=\"Input: tm18_2_2.png\"><\/a><figcaption>Input<\/figcaption><\/figure><figure><a href=\"assets/tm18_2_2-ground_truth.png\" target=\"_blank\" rel=\"noopener\"><img src=\"assets/tm18_2_2-ground_truth.png\" width=\"512\" height=\"512\" alt=\"GT: tm18_2_2.png\"><\/a><figcaption>GT<\/figcaption><\/figure><figure><a href=\"assets/tm18_2_2-00_R_pixel.png\" target=\"_blank\" rel=\"noopener\"><img src=\"assets/tm18_2_2-00_R_pixel.png\" width=\"512\" height=\"512\" alt=\"00 · CA 24.2 %: tm18_2_2.png\"><\/a><figcaption>00 · CA 24.2 %<\/figcaption><\/figure><\/div><p><strong>Mean over 80 images:<\/strong> 00: CS 1.33 %, CA 24.21 %<\/p><\/div><\/div>"], ["01 · Gaussian smoothing", "<div class=\"columns\"><div><pre><code>def blur(a, sigma):\n    return gaussian_filter(\n        a, sigma=(sigma, sigma, 0),\n        mode=&quot;reflect&quot;, truncate=3\n    )\n\nfeat = blur(a[:, :, :1], 5)<\/code><\/pre><p>Gaussian weights average the neighbourhood, σ = 5 pixels. The final zero keeps channels separate. Fine texture variations decrease, but boundaries also become blurred.<\/p><\/div><div><div class=\"images\"><figure><a href=\"assets/tm18_2_2-source.png\" target=\"_blank\" rel=\"noopener\"><img src=\"assets/tm18_2_2-source.png\" width=\"512\" height=\"512\" alt=\"Input: tm18_2_2.png\"><\/a><figcaption>Input<\/figcaption><\/figure><figure><a href=\"assets/tm18_2_2-ground_truth.png\" target=\"_blank\" rel=\"noopener\"><img src=\"assets/tm18_2_2-ground_truth.png\" width=\"512\" height=\"512\" alt=\"GT: tm18_2_2.png\"><\/a><figcaption>GT<\/figcaption><\/figure><figure><a href=\"assets/tm18_2_2-00_R_pixel.png\" target=\"_blank\" rel=\"noopener\"><img src=\"assets/tm18_2_2-00_R_pixel.png\" width=\"512\" height=\"512\" alt=\"00 · CA 24.2 %: tm18_2_2.png\"><\/a><figcaption>00 · CA 24.2 %<\/figcaption><\/figure><figure><a href=\"assets/tm18_2_2-01_R_blur.png\" target=\"_blank\" rel=\"noopener\"><img src=\"assets/tm18_2_2-01_R_blur.png\" width=\"512\" height=\"512\" alt=\"01 · CA 31.1 %: tm18_2_2.png\"><\/a><figcaption>01 · CA 31.1 %<\/figcaption><\/figure><\/div><p><strong>Mean over 80 images:<\/strong> 00: CS 1.33 %, CA 24.21 %; 01: CS 2.51 %, CA 27.80 %<\/p><\/div><\/div>"], ["02–03 · RGB and CIELAB", "<div class=\"columns\"><div><pre><code># 02: three colour channels\nfeat = blur(a, 5)\n\n# 03: lightness and chromatic coordinates\nlab = rgb2lab(a, illuminant=&quot;D65&quot;)\nlab = lab.astype(np.float32) / 100\nfeat = blur(lab, 5)<\/code><\/pre><p>RGB provides three features instead of one. CIELAB changes the geometry of colour distances and separates L* lightness from a*, b*. Both variants use three features and the same blur.<\/p><\/div><div><div class=\"images\"><figure><a href=\"assets/tm18_2_2-source.png\" target=\"_blank\" rel=\"noopener\"><img src=\"assets/tm18_2_2-source.png\" width=\"512\" height=\"512\" alt=\"Input: tm18_2_2.png\"><\/a><figcaption>Input<\/figcaption><\/figure><figure><a href=\"assets/tm18_2_2-ground_truth.png\" target=\"_blank\" rel=\"noopener\"><img src=\"assets/tm18_2_2-ground_truth.png\" width=\"512\" height=\"512\" alt=\"GT: tm18_2_2.png\"><\/a><figcaption>GT<\/figcaption><\/figure><figure><a href=\"assets/tm18_2_2-02_RGB_blur.png\" target=\"_blank\" rel=\"noopener\"><img src=\"assets/tm18_2_2-02_RGB_blur.png\" width=\"512\" height=\"512\" alt=\"02 · CA 42.2 %: tm18_2_2.png\"><\/a><figcaption>02 · CA 42.2 %<\/figcaption><\/figure><figure><a href=\"assets/tm18_2_2-03_Lab_blur.png\" target=\"_blank\" rel=\"noopener\"><img src=\"assets/tm18_2_2-03_Lab_blur.png\" width=\"512\" height=\"512\" alt=\"03 · CA 56.5 %: tm18_2_2.png\"><\/a><figcaption>03 · CA 56.5 %<\/figcaption><\/figure><\/div><p><strong>Mean over 80 images:<\/strong> 02: CS 8.41 %, CA 35.57 %; 03: CS 16.62 %, CA 44.61 %<\/p><\/div><\/div>"], ["04 · Local mean and deviation", "<div class=\"columns\"><div><pre><code>def local_stats(a, sigma):\n    mean = blur(a, sigma)\n    var = blur(a * a, sigma) - mean * mean\n    std = np.sqrt(np.maximum(var, 0))\n    return np.concatenate([mean, std], axis=-1)\n\nfeat = local_stats(lab, 5)<\/code><\/pre><p>Three means describe colour, three deviations describe local variation: 6 features. <code>maximum(var, 0)<\/code> removes negative variance caused by rounding. The same average colour need not imply the same texture.<\/p><\/div><div><div class=\"images\"><figure><a href=\"assets/tm18_2_2-source.png\" target=\"_blank\" rel=\"noopener\"><img src=\"assets/tm18_2_2-source.png\" width=\"512\" height=\"512\" alt=\"Input: tm18_2_2.png\"><\/a><figcaption>Input<\/figcaption><\/figure><figure><a href=\"assets/tm18_2_2-ground_truth.png\" target=\"_blank\" rel=\"noopener\"><img src=\"assets/tm18_2_2-ground_truth.png\" width=\"512\" height=\"512\" alt=\"GT: tm18_2_2.png\"><\/a><figcaption>GT<\/figcaption><\/figure><figure><a href=\"assets/tm18_2_2-03_Lab_blur.png\" target=\"_blank\" rel=\"noopener\"><img src=\"assets/tm18_2_2-03_Lab_blur.png\" width=\"512\" height=\"512\" alt=\"03 · CA 56.5 %: tm18_2_2.png\"><\/a><figcaption>03 · CA 56.5 %<\/figcaption><\/figure><figure><a href=\"assets/tm18_2_2-04_Lab_std.png\" target=\"_blank\" rel=\"noopener\"><img src=\"assets/tm18_2_2-04_Lab_std.png\" width=\"512\" height=\"512\" alt=\"04 · CA 60.6 %: tm18_2_2.png\"><\/a><figcaption>04 · CA 60.6 %<\/figcaption><\/figure><\/div><p><strong>Mean over 80 images:<\/strong> 03: CS 16.62 %, CA 44.61 %; 04: CS 19.40 %, CA 46.83 %<\/p><\/div><\/div>"], ["05 · Feature standardisation", "<div class=\"columns\"><div><pre><code>sample = flat[selected]\nmean = sample.mean(axis=0)\nscale = np.maximum(sample.std(axis=0), 0.01)\nflat = (flat - mean) / scale\nsample = flat[selected]<\/code><\/pre><p>Features receive comparable scales in Euclidean distance. We estimate means and deviations from the input image sample without GT. This can also amplify less useful features.<\/p><\/div><div><div class=\"images\"><figure><a href=\"assets/tm18_2_2-source.png\" target=\"_blank\" rel=\"noopener\"><img src=\"assets/tm18_2_2-source.png\" width=\"512\" height=\"512\" alt=\"Input: tm18_2_2.png\"><\/a><figcaption>Input<\/figcaption><\/figure><figure><a href=\"assets/tm18_2_2-ground_truth.png\" target=\"_blank\" rel=\"noopener\"><img src=\"assets/tm18_2_2-ground_truth.png\" width=\"512\" height=\"512\" alt=\"GT: tm18_2_2.png\"><\/a><figcaption>GT<\/figcaption><\/figure><figure><a href=\"assets/tm18_2_2-04_Lab_std.png\" target=\"_blank\" rel=\"noopener\"><img src=\"assets/tm18_2_2-04_Lab_std.png\" width=\"512\" height=\"512\" alt=\"04 · CA 60.6 %: tm18_2_2.png\"><\/a><figcaption>04 · CA 60.6 %<\/figcaption><\/figure><figure><a href=\"assets/tm18_2_2-05_Lab_std_scaled.png\" target=\"_blank\" rel=\"noopener\"><img src=\"assets/tm18_2_2-05_Lab_std_scaled.png\" width=\"512\" height=\"512\" alt=\"05 · CA 66.1 %: tm18_2_2.png\"><\/a><figcaption>05 · CA 66.1 %<\/figcaption><\/figure><\/div><p><strong>Mean over 80 images:<\/strong> 04: CS 19.40 %, CA 46.83 %; 05: CS 20.67 %, CA 48.51 %<\/p><\/div><\/div>"], ["06 · Two neighbourhood scales", "<div class=\"columns\"><div><pre><code>feat = np.concatenate(\n    [local_stats(lab, s) for s in (3, 9)],\n    axis=-1\n)\n# Then standardise and run the same K-means.<\/code><\/pre><p>Six statistics at σ = 3 and six at σ = 9 give 12 features. Small neighbourhoods capture finer structure, larger ones more stable texture properties. The cost is more computation and wider transitions near boundaries.<\/p><\/div><div><div class=\"images\"><figure><a href=\"assets/tm18_2_2-source.png\" target=\"_blank\" rel=\"noopener\"><img src=\"assets/tm18_2_2-source.png\" width=\"512\" height=\"512\" alt=\"Input: tm18_2_2.png\"><\/a><figcaption>Input<\/figcaption><\/figure><figure><a href=\"assets/tm18_2_2-ground_truth.png\" target=\"_blank\" rel=\"noopener\"><img src=\"assets/tm18_2_2-ground_truth.png\" width=\"512\" height=\"512\" alt=\"GT: tm18_2_2.png\"><\/a><figcaption>GT<\/figcaption><\/figure><figure><a href=\"assets/tm18_2_2-05_Lab_std_scaled.png\" target=\"_blank\" rel=\"noopener\"><img src=\"assets/tm18_2_2-05_Lab_std_scaled.png\" width=\"512\" height=\"512\" alt=\"05 · CA 66.1 %: tm18_2_2.png\"><\/a><figcaption>05 · CA 66.1 %<\/figcaption><\/figure><figure><a href=\"assets/tm18_2_2-06_multiscale.png\" target=\"_blank\" rel=\"noopener\"><img src=\"assets/tm18_2_2-06_multiscale.png\" width=\"512\" height=\"512\" alt=\"06 · CA 68.9 %: tm18_2_2.png\"><\/a><figcaption>06 · CA 68.9 %<\/figcaption><\/figure><\/div><p><strong>Mean over 80 images:<\/strong> 05: CS 20.67 %, CA 48.51 %; 06: CS 21.76 %, CA 50.40 %<\/p><\/div><\/div>"], ["07 · Neighbourhood voting", "<div class=\"columns\"><div><pre><code>votes = np.stack([\n    gaussian_filter(\n        (labels == c).astype(np.float32),\n        3, mode=&quot;reflect&quot;, truncate=3\n    ) for c in range(k)\n])\nlabels = np.argmax(votes, axis=0)<\/code><\/pre><p>Each class votes through its binary mask, σ = 3. The greatest local support wins. Class IDs have no numeric order, so averaging them is meaningless. Voting may remove small islands as well as correct thin regions.<\/p><\/div><div><div class=\"images\"><figure><a href=\"assets/tm18_2_2-source.png\" target=\"_blank\" rel=\"noopener\"><img src=\"assets/tm18_2_2-source.png\" width=\"512\" height=\"512\" alt=\"Input: tm18_2_2.png\"><\/a><figcaption>Input<\/figcaption><\/figure><figure><a href=\"assets/tm18_2_2-ground_truth.png\" target=\"_blank\" rel=\"noopener\"><img src=\"assets/tm18_2_2-ground_truth.png\" width=\"512\" height=\"512\" alt=\"GT: tm18_2_2.png\"><\/a><figcaption>GT<\/figcaption><\/figure><figure><a href=\"assets/tm18_2_2-06_multiscale.png\" target=\"_blank\" rel=\"noopener\"><img src=\"assets/tm18_2_2-06_multiscale.png\" width=\"512\" height=\"512\" alt=\"06 · CA 68.9 %: tm18_2_2.png\"><\/a><figcaption>06 · CA 68.9 %<\/figcaption><\/figure><figure><a href=\"assets/tm18_2_2-07_multiscale_vote.png\" target=\"_blank\" rel=\"noopener\"><img src=\"assets/tm18_2_2-07_multiscale_vote.png\" width=\"512\" height=\"512\" alt=\"07 · CA 69.9 %: tm18_2_2.png\"><\/a><figcaption>07 · CA 69.9 %<\/figcaption><\/figure><\/div><p><strong>Mean over 80 images:<\/strong> 06: CS 21.76 %, CA 50.40 %; 07: CS 22.26 %, CA 50.97 %<\/p><\/div><\/div>"], ["08–09 · Directional lightness changes", "<div class=\"columns\"><div><pre><code>light = lab[:, :, 0]\ndx = sobel(light, axis=1, mode=&quot;reflect&quot;) / 8\ndy = sobel(light, axis=0, mode=&quot;reflect&quot;) / 8\nenergy = np.stack([dx * dx, dy * dy], axis=-1)\nfeat = np.concatenate(\n    [feat, np.sqrt(blur(energy, 5))], axis=-1\n)<\/code><\/pre><p>We add two local gradient energies to the 12 features of method 06, then standardise. Method 08 has no voting, method 09 adds it. <strong>Controlled comparisons:<\/strong> 06 vs 08 for features, 08 vs 09 for voting.<\/p><\/div><div><div class=\"images\"><figure><a href=\"assets/tm18_2_2-source.png\" target=\"_blank\" rel=\"noopener\"><img src=\"assets/tm18_2_2-source.png\" width=\"512\" height=\"512\" alt=\"Input: tm18_2_2.png\"><\/a><figcaption>Input<\/figcaption><\/figure><figure><a href=\"assets/tm18_2_2-ground_truth.png\" target=\"_blank\" rel=\"noopener\"><img src=\"assets/tm18_2_2-ground_truth.png\" width=\"512\" height=\"512\" alt=\"GT: tm18_2_2.png\"><\/a><figcaption>GT<\/figcaption><\/figure><figure><a href=\"assets/tm18_2_2-08_gradients.png\" target=\"_blank\" rel=\"noopener\"><img src=\"assets/tm18_2_2-08_gradients.png\" width=\"512\" height=\"512\" alt=\"08 · CA 68.5 %: tm18_2_2.png\"><\/a><figcaption>08 · CA 68.5 %<\/figcaption><\/figure><figure><a href=\"assets/tm18_2_2-09_gradients_vote.png\" target=\"_blank\" rel=\"noopener\"><img src=\"assets/tm18_2_2-09_gradients_vote.png\" width=\"512\" height=\"512\" alt=\"09 · CA 69.8 %: tm18_2_2.png\"><\/a><figcaption>09 · CA 69.8 %<\/figcaption><\/figure><\/div><p><strong>Mean over 80 images:<\/strong> 08: CS 22.01 %, CA 50.98 %; 09: CS 22.40 %, CA 51.58 %<\/p><\/div><\/div>"], ["Results of all variants", "<table><thead><tr><th>Variant<\/th><th>CS % ↑<\/th><th>CA % ↑<\/th><th>OS % ↓<\/th><th>US % ↓<\/th><th>ARI ↑<\/th><th>VI bits ↓<\/th><\/tr><\/thead><tbody><tr><th>00_R_pixel<\/th><td>1.33<\/td><td>24.21<\/td><td>0.00<\/td><td>1.04<\/td><td>0.135<\/td><td>4.047<\/td><\/tr><tr><th>01_R_blur<\/th><td>2.51<\/td><td>27.80<\/td><td>1.94<\/td><td>1.39<\/td><td>0.178<\/td><td>3.747<\/td><\/tr><tr><th>02_RGB_blur<\/th><td>8.41<\/td><td>35.57<\/td><td>4.46<\/td><td>0.80<\/td><td>0.275<\/td><td>3.177<\/td><\/tr><tr><th>03_Lab_blur<\/th><td>16.62<\/td><td>44.61<\/td><td>7.93<\/td><td>2.68<\/td><td>0.387<\/td><td>2.528<\/td><\/tr><tr><th>04_Lab_std<\/th><td>19.40<\/td><td>46.83<\/td><td>7.77<\/td><td>4.34<\/td><td>0.423<\/td><td>2.373<\/td><\/tr><tr><th>05_Lab_std_scaled<\/th><td>20.67<\/td><td>48.51<\/td><td>8.01<\/td><td>7.10<\/td><td>0.451<\/td><td>2.307<\/td><\/tr><tr><th>06_multiscale<\/th><td>21.76<\/td><td>50.40<\/td><td>9.34<\/td><td>7.13<\/td><td>0.476<\/td><td>2.170<\/td><\/tr><tr><th>07_multiscale_vote<\/th><td>22.26<\/td><td>50.97<\/td><td>9.55<\/td><td>7.78<\/td><td>0.484<\/td><td>2.119<\/td><\/tr><tr><th>08_gradients<\/th><td>22.01<\/td><td>50.98<\/td><td>7.94<\/td><td>6.23<\/td><td>0.481<\/td><td>2.176<\/td><\/tr><tr><th>09_gradients_vote<\/th><td>22.40<\/td><td>51.58<\/td><td>7.98<\/td><td>6.85<\/td><td>0.489<\/td><td>2.124<\/td><\/tr><\/tbody><\/table><p><small>Means over 80 images. CS counts intersections covering at least 75% of both regions. CA is GT-area-weighted IoU after maximum-overlap class matching. OS / US capture region splitting / merging and can be zero even for poor segmentations. ARI is chance-adjusted pair agreement. VI is the information difference between partitions.<\/small><\/p>"], ["A more complex method may fail", "<div class=\"images\"><figure><a href=\"assets/tm2_2_2-source.png\" target=\"_blank\" rel=\"noopener\"><img src=\"assets/tm2_2_2-source.png\" width=\"512\" height=\"512\" alt=\"tm2_2_2: tm2_2_2.png\"><\/a><figcaption>tm2_2_2<\/figcaption><\/figure><figure><a href=\"assets/tm2_2_2-ground_truth.png\" target=\"_blank\" rel=\"noopener\"><img src=\"assets/tm2_2_2-ground_truth.png\" width=\"512\" height=\"512\" alt=\"GT: tm2_2_2.png\"><\/a><figcaption>GT<\/figcaption><\/figure><figure><a href=\"assets/tm2_2_2-04_Lab_std.png\" target=\"_blank\" rel=\"noopener\"><img src=\"assets/tm2_2_2-04_Lab_std.png\" width=\"512\" height=\"512\" alt=\"04 · CS 74.69 %: tm2_2_2.png\"><\/a><figcaption>04 · CS 74.69 %<\/figcaption><\/figure><figure><a href=\"assets/tm2_2_2-05_Lab_std_scaled.png\" target=\"_blank\" rel=\"noopener\"><img src=\"assets/tm2_2_2-05_Lab_std_scaled.png\" width=\"512\" height=\"512\" alt=\"05 · CS 0.00 %: tm2_2_2.png\"><\/a><figcaption>05 · CS 0.00 %<\/figcaption><\/figure><\/div><p><strong>Standardisation 04 → 05:<\/strong> on 16 development images, CS drops from 13.66% to 10.27%, although the overall mean increases. Above is a clear individual failure.<\/p><p><small>Groups 1, 6, 11, 16 form the development set. The other 64 images are held out. Variants and parameters were fixed before scoring. Both development CS and CA improve along 00–04. Textures may recur, so this is not an independent test of unseen textures.<\/small><\/p>"], ["Your own experiment", "<pre><code>python -m pip install -r requirements.txt\npython segment.py input.png seg.png --k 6 \\\n    --method 04_Lab_std<\/code><\/pre><p>Change one thing: channel, σ, feature or voting. Write a hypothesis first, then compare against the parent variant. Record images that get worse as well. Use the development split when tuning your own method.<\/p><p><a href=\"source.zip\" download>Source ZIP<\/a> · <a href=\"segment.py\" download>segment.py<\/a> · <a href=\"summary.csv\" download>Results CSV<\/a> · <a href=\"offline.zip\" download>Offline presentation<\/a> · <a href=\"https://roz-mosaic.richtrad.chatgpt.site\">Mosaic evaluator<\/a><\/p><p><small>The example uses Bash line continuation; on Windows enter it as a single line. K must match the assignment for that image. Output is a PNG of class IDs; coloured previews are for display only.<\/small><\/p><p><small>Documentation: <a href=\"https://scikit-learn.org/stable/modules/generated/sklearn.cluster.KMeans.html\">KMeans<\/a> · <a href=\"https://docs.scipy.org/doc/scipy/reference/generated/scipy.ndimage.gaussian_filter.html\">gaussian_filter<\/a> · <a href=\"https://scikit-image.org/docs/stable/api/skimage.color.html#skimage.color.rgb2lab\">rgb2lab<\/a><\/small><\/p>"]]}</script><script src="slides.js"></script></body></html>
