<!doctype html><html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Segmentace mozaiky krok za krokem | GRAFIT</title><meta name="description" content="13 krátkých snímků: K-means, blur, barva, lokální statistiky a segmentace textur. Kód v C++17 a měřené výsledky."><link rel="stylesheet" href="slides.css"></head><body><header><a class="brand" id="back" href="../">← Přehled ROZ</a><span class="grow"></span><button id="previous" aria-label="Previous slide">←</button><select id="slide-select" aria-label="Slide"></select><button id="next" aria-label="Next slide">→</button><button id="all" aria-pressed="false">Čtení / snímky</button><button id="print">Tisk / PDF</button><button id="language" aria-label="Switch language">EN</button></header><main></main><footer id="hint"></footer><noscript>Pro prezentaci zapněte JavaScript. Enable JavaScript to view the slides.</noscript><script type="application/json" id="deck-data">{"cs": [["Segmentace mozaiky krok za krokem", "<p>Krátká ukázka, jak měnit příznaky a základní metody.<\/p><div class=\"images\"><figure><a href=\"assets/tm18_2_2-source.png\" target=\"_blank\" rel=\"noopener\"><img src=\"assets/tm18_2_2-source.png\" width=\"512\" height=\"512\" alt=\"Vstupní obraz: tm18_2_2.png\"><\/a><figcaption>Vstupní obraz<\/figcaption><\/figure><figure><a href=\"assets/tm18_2_2-ground_truth.png\" target=\"_blank\" rel=\"noopener\"><img src=\"assets/tm18_2_2-ground_truth.png\" width=\"512\" height=\"512\" alt=\"Referenční segmentace (GT): tm18_2_2.png\"><\/a><figcaption>Referenční segmentace (GT)<\/figcaption><\/figure><figure><a href=\"assets/tm18_2_2-09_gradients_vote.png\" target=\"_blank\" rel=\"noopener\"><img src=\"assets/tm18_2_2-09_gradients_vote.png\" width=\"512\" height=\"512\" alt=\"Výsledek metody 09: tm18_2_2.png\"><\/a><figcaption>Výsledek metody 09<\/figcaption><\/figure><\/div><p>C++17, K-means a 10 variant. Stejný obraz v každém kroku, kód a skutečně naměřené výsledky.<\/p><p><small>ROZ · GRAFIT · 12. 11. 2026. Ilustrativní mozaika tm18_2_2, K = 6. Vybraná pro srozumitelnou ukázku, nereprezentuje průměr celé sady.<\/small><\/p>"], ["Společný základ: K-means", "<div class=\"columns\"><div><pre><code>Image rgb = readRGB(&quot;input.png&quot;);\nImage feat = features(rgb, 4);\nstd::mt19937 rng(20261112);\nauto sample = samplePixels(\n    rgb.w * rgb.h, 8192, rng);\nauto centers = fitKmeans(\n    feat, sample, k, rng, 5, 100);\nauto labels = predict(feat, centers, k);<\/code><\/pre><\/div><div><p>Každý pixel popisuje příznakový vektor <code>feat(y, x, c)<\/code>. K-means najde K center a přiřadí každému pixelu nejbližší centrum.<\/p><p>Centra učíme na 8 192 pixelech. Klasifikujeme všech 512 × 512 pixelů. Stejný seed a pět inicializací držíme pro všechny varianty.<\/p><p><strong>Vstup:<\/strong> RGB a známé K ze zadání. GT používáme až pro hodnocení a sjednocení barev ve vizualizaci.<\/p><p><small>Samostatný C++17 a standardní knihovna. Přiložené stb čte a zapisuje PNG. Třída Image a pomocné funkce jsou v segment.cpp. Všechny obrázky a čísla jsme znovu spočítali touto verzí.<\/small><\/p><\/div><\/div>"], ["00 · Jen červený kanál", "<div class=\"columns\"><div><pre><code>// readRGB converts bytes to float values in [0, 1].\nImage feat = channel(rgb, 0);  // 0 = R, 1 = G, 2 = B<\/code><\/pre><p>Jeden pixel, jedno číslo R. Metoda nevidí zelenou, modrou ani okolí. Podobná červená hodnota může patřit různým texturám. <strong>Otázka:<\/strong> které oblasti se slévají?<\/p><\/div><div><div class=\"images\"><figure><a href=\"assets/tm18_2_2-source.png\" target=\"_blank\" rel=\"noopener\"><img src=\"assets/tm18_2_2-source.png\" width=\"512\" height=\"512\" alt=\"Vstup: tm18_2_2.png\"><\/a><figcaption>Vstup<\/figcaption><\/figure><figure><a href=\"assets/tm18_2_2-ground_truth.png\" target=\"_blank\" rel=\"noopener\"><img src=\"assets/tm18_2_2-ground_truth.png\" width=\"512\" height=\"512\" alt=\"GT: tm18_2_2.png\"><\/a><figcaption>GT<\/figcaption><\/figure><figure><a href=\"assets/tm18_2_2-00_R_pixel.png\" target=\"_blank\" rel=\"noopener\"><img src=\"assets/tm18_2_2-00_R_pixel.png\" width=\"512\" height=\"512\" alt=\"00 · CA 24.7 %: tm18_2_2.png\"><\/a><figcaption>00 · CA 24.7 %<\/figcaption><\/figure><\/div><p><strong>Průměr 80 obrázků:<\/strong> 00: CS 1.34 %, CA 24.14 %<\/p><\/div><\/div>"], ["01 · Gaussovo vyhlazení", "<div class=\"columns\"><div><pre><code>Image feat = blur(channel(rgb, 0), 5.0f);\n\n// Gaussian weights inside blur():\nint r = int(3 * sigma + 0.5f);\nfor (int i = -r; i &lt;= r; ++i)\n    kernel[i + r] = std::exp(-i*i / (2*sigma*sigma));\n// Normalise weights, filter rows and columns.<\/code><\/pre><p>Průměrujeme okolí s Gaussovými vahami, σ = 5 pixelů. Filtr provádí dva prostorové průchody, každý kanál zvlášť. Ubyde drobných změn uvnitř textury, ale rozmažou se také hranice.<\/p><\/div><div><div class=\"images\"><figure><a href=\"assets/tm18_2_2-source.png\" target=\"_blank\" rel=\"noopener\"><img src=\"assets/tm18_2_2-source.png\" width=\"512\" height=\"512\" alt=\"Vstup: tm18_2_2.png\"><\/a><figcaption>Vstup<\/figcaption><\/figure><figure><a href=\"assets/tm18_2_2-ground_truth.png\" target=\"_blank\" rel=\"noopener\"><img src=\"assets/tm18_2_2-ground_truth.png\" width=\"512\" height=\"512\" alt=\"GT: tm18_2_2.png\"><\/a><figcaption>GT<\/figcaption><\/figure><figure><a href=\"assets/tm18_2_2-00_R_pixel.png\" target=\"_blank\" rel=\"noopener\"><img src=\"assets/tm18_2_2-00_R_pixel.png\" width=\"512\" height=\"512\" alt=\"00 · CA 24.7 %: tm18_2_2.png\"><\/a><figcaption>00 · CA 24.7 %<\/figcaption><\/figure><figure><a href=\"assets/tm18_2_2-01_R_blur.png\" target=\"_blank\" rel=\"noopener\"><img src=\"assets/tm18_2_2-01_R_blur.png\" width=\"512\" height=\"512\" alt=\"01 · CA 30.8 %: tm18_2_2.png\"><\/a><figcaption>01 · CA 30.8 %<\/figcaption><\/figure><\/div><p><strong>Průměr 80 obrázků:<\/strong> 00: CS 1.34 %, CA 24.14 %; 01: CS 2.10 %, CA 27.83 %<\/p><\/div><\/div>"], ["02–03 · RGB a CIELAB", "<div class=\"columns\"><div><pre><code>// 02: three colour channels\nImage feat = blur(rgb, 5);\n\n// 03: D65 Lab, all coordinates divided by 100\nImage lab = toLab(rgb);\nfeat = blur(lab, 5);<\/code><\/pre><p>RGB dává tři příznaky místo jednoho. CIELAB mění geometrii barevných vzdáleností a odděluje světlost L* od a*, b*. Počet příznaků zůstává 3. Obě varianty mají stejný blur.<\/p><\/div><div><div class=\"images\"><figure><a href=\"assets/tm18_2_2-source.png\" target=\"_blank\" rel=\"noopener\"><img src=\"assets/tm18_2_2-source.png\" width=\"512\" height=\"512\" alt=\"Vstup: tm18_2_2.png\"><\/a><figcaption>Vstup<\/figcaption><\/figure><figure><a href=\"assets/tm18_2_2-ground_truth.png\" target=\"_blank\" rel=\"noopener\"><img src=\"assets/tm18_2_2-ground_truth.png\" width=\"512\" height=\"512\" alt=\"GT: tm18_2_2.png\"><\/a><figcaption>GT<\/figcaption><\/figure><figure><a href=\"assets/tm18_2_2-02_RGB_blur.png\" target=\"_blank\" rel=\"noopener\"><img src=\"assets/tm18_2_2-02_RGB_blur.png\" width=\"512\" height=\"512\" alt=\"02 · CA 42.1 %: tm18_2_2.png\"><\/a><figcaption>02 · CA 42.1 %<\/figcaption><\/figure><figure><a href=\"assets/tm18_2_2-03_Lab_blur.png\" target=\"_blank\" rel=\"noopener\"><img src=\"assets/tm18_2_2-03_Lab_blur.png\" width=\"512\" height=\"512\" alt=\"03 · CA 57.2 %: tm18_2_2.png\"><\/a><figcaption>03 · CA 57.2 %<\/figcaption><\/figure><\/div><p><strong>Průměr 80 obrázků:<\/strong> 02: CS 9.02 %, CA 35.85 %; 03: CS 18.17 %, CA 45.00 %<\/p><\/div><\/div>"], ["04 · Lokální průměr a odchylka", "<div class=\"columns\"><div><pre><code>Image mean = blur(a, sigma), square = a;\nfor (float&amp; v : square.data) v *= v;\nImage deviation = blur(square, sigma);\nfor (size_t i = 0; i &lt; a.data.size(); ++i) {\n    float variance = deviation.data[i]\n                   - mean.data[i] * mean.data[i];\n    deviation.data[i] = std::sqrt(\n        std::max(variance, 0.0f));\n}\nreturn concat({mean, deviation});<\/code><\/pre><p>Tři průměry popisují barvu, tři odchylky proměnlivost v okolí. Máme 6 příznaků. <code>std::max(variance, 0.0f)<\/code> ošetřuje zápornou odchylku výpočtu vzniklou zaokrouhlením. Stejná průměrná barva už nemusí znamenat stejnou texturu.<\/p><\/div><div><div class=\"images\"><figure><a href=\"assets/tm18_2_2-source.png\" target=\"_blank\" rel=\"noopener\"><img src=\"assets/tm18_2_2-source.png\" width=\"512\" height=\"512\" alt=\"Vstup: tm18_2_2.png\"><\/a><figcaption>Vstup<\/figcaption><\/figure><figure><a href=\"assets/tm18_2_2-ground_truth.png\" target=\"_blank\" rel=\"noopener\"><img src=\"assets/tm18_2_2-ground_truth.png\" width=\"512\" height=\"512\" alt=\"GT: tm18_2_2.png\"><\/a><figcaption>GT<\/figcaption><\/figure><figure><a href=\"assets/tm18_2_2-03_Lab_blur.png\" target=\"_blank\" rel=\"noopener\"><img src=\"assets/tm18_2_2-03_Lab_blur.png\" width=\"512\" height=\"512\" alt=\"03 · CA 57.2 %: tm18_2_2.png\"><\/a><figcaption>03 · CA 57.2 %<\/figcaption><\/figure><figure><a href=\"assets/tm18_2_2-04_Lab_std.png\" target=\"_blank\" rel=\"noopener\"><img src=\"assets/tm18_2_2-04_Lab_std.png\" width=\"512\" height=\"512\" alt=\"04 · CA 60.7 %: tm18_2_2.png\"><\/a><figcaption>04 · CA 60.7 %<\/figcaption><\/figure><\/div><p><strong>Průměr 80 obrázků:<\/strong> 03: CS 18.17 %, CA 45.00 %; 04: CS 18.55 %, CA 47.00 %<\/p><\/div><\/div>"], ["05 · Standardizace příznaků", "<div class=\"columns\"><div><pre><code>// Estimate mean and variance on the sampled pixels.\n// Apply this transformation to every pixel, channel c:\ndouble scale = std::max(\n    std::sqrt(var / sample.size()), 0.01);\nfor (size_t i = c; i &lt; feat.data.size();\n     i += feat.channels)\n    feat.data[i] = float((feat.data[i] - mean) / scale);\n\n// Full helper call before fitting K-means:\nstandardize(feat, sample);<\/code><\/pre><p>Příznaky dostanou srovnatelná měřítka v eukleidovské vzdálenosti. Průměr a odchylku odhadujeme ze vzorku vstupního obrazu, bez GT. Může ale vzrůst i vliv méně užitečného příznaku.<\/p><\/div><div><div class=\"images\"><figure><a href=\"assets/tm18_2_2-source.png\" target=\"_blank\" rel=\"noopener\"><img src=\"assets/tm18_2_2-source.png\" width=\"512\" height=\"512\" alt=\"Vstup: tm18_2_2.png\"><\/a><figcaption>Vstup<\/figcaption><\/figure><figure><a href=\"assets/tm18_2_2-ground_truth.png\" target=\"_blank\" rel=\"noopener\"><img src=\"assets/tm18_2_2-ground_truth.png\" width=\"512\" height=\"512\" alt=\"GT: tm18_2_2.png\"><\/a><figcaption>GT<\/figcaption><\/figure><figure><a href=\"assets/tm18_2_2-04_Lab_std.png\" target=\"_blank\" rel=\"noopener\"><img src=\"assets/tm18_2_2-04_Lab_std.png\" width=\"512\" height=\"512\" alt=\"04 · CA 60.7 %: tm18_2_2.png\"><\/a><figcaption>04 · CA 60.7 %<\/figcaption><\/figure><figure><a href=\"assets/tm18_2_2-05_Lab_std_scaled.png\" target=\"_blank\" rel=\"noopener\"><img src=\"assets/tm18_2_2-05_Lab_std_scaled.png\" width=\"512\" height=\"512\" alt=\"05 · CA 66.4 %: tm18_2_2.png\"><\/a><figcaption>05 · CA 66.4 %<\/figcaption><\/figure><\/div><p><strong>Průměr 80 obrázků:<\/strong> 04: CS 18.55 %, CA 47.00 %; 05: CS 19.78 %, CA 47.97 %<\/p><\/div><\/div>"], ["06 · Dvě velikosti okolí", "<div class=\"columns\"><div><pre><code>Image feat = concat({\n    localStats(lab, 3),\n    localStats(lab, 9)\n});\nstandardize(feat, sample);<\/code><\/pre><p>Šest statistik pro σ = 3 a šest pro σ = 9 dává 12 příznaků. Menší okolí zachytí jemnější strukturu, větší stabilnější charakter textury. Cena: více výpočtů a širší přechody u hranic.<\/p><\/div><div><div class=\"images\"><figure><a href=\"assets/tm18_2_2-source.png\" target=\"_blank\" rel=\"noopener\"><img src=\"assets/tm18_2_2-source.png\" width=\"512\" height=\"512\" alt=\"Vstup: tm18_2_2.png\"><\/a><figcaption>Vstup<\/figcaption><\/figure><figure><a href=\"assets/tm18_2_2-ground_truth.png\" target=\"_blank\" rel=\"noopener\"><img src=\"assets/tm18_2_2-ground_truth.png\" width=\"512\" height=\"512\" alt=\"GT: tm18_2_2.png\"><\/a><figcaption>GT<\/figcaption><\/figure><figure><a href=\"assets/tm18_2_2-05_Lab_std_scaled.png\" target=\"_blank\" rel=\"noopener\"><img src=\"assets/tm18_2_2-05_Lab_std_scaled.png\" width=\"512\" height=\"512\" alt=\"05 · CA 66.4 %: tm18_2_2.png\"><\/a><figcaption>05 · CA 66.4 %<\/figcaption><\/figure><figure><a href=\"assets/tm18_2_2-06_multiscale.png\" target=\"_blank\" rel=\"noopener\"><img src=\"assets/tm18_2_2-06_multiscale.png\" width=\"512\" height=\"512\" alt=\"06 · CA 69.2 %: tm18_2_2.png\"><\/a><figcaption>06 · CA 69.2 %<\/figcaption><\/figure><\/div><p><strong>Průměr 80 obrázků:<\/strong> 05: CS 19.78 %, CA 47.97 %; 06: CS 21.62 %, CA 50.46 %<\/p><\/div><\/div>"], ["07 · Hlasování okolí", "<div class=\"columns\"><div><pre><code>// Inside vote(): one binary mask per class c.\nImage mask(w, h, 1);\nfor (size_t i = 0; i &lt; labels.size(); ++i)\n    mask.data[i] = labels[i] == c ? 1.0f : 0.0f;\nImage support = blur(mask, 3);\n// At each pixel, keep the class with maximum support.\n\nlabels = vote(labels, rgb.w, rgb.h, k, 3);<\/code><\/pre><p>Každá třída hlasuje přes svou binární masku, σ = 3. Vyhraje největší lokální podpora. ID tříd nemají číselné pořadí: jejich přímé průměrování nedává smysl. Hlasování může odstranit malé ostrůvky i správné tenké oblasti.<\/p><\/div><div><div class=\"images\"><figure><a href=\"assets/tm18_2_2-source.png\" target=\"_blank\" rel=\"noopener\"><img src=\"assets/tm18_2_2-source.png\" width=\"512\" height=\"512\" alt=\"Vstup: tm18_2_2.png\"><\/a><figcaption>Vstup<\/figcaption><\/figure><figure><a href=\"assets/tm18_2_2-ground_truth.png\" target=\"_blank\" rel=\"noopener\"><img src=\"assets/tm18_2_2-ground_truth.png\" width=\"512\" height=\"512\" alt=\"GT: tm18_2_2.png\"><\/a><figcaption>GT<\/figcaption><\/figure><figure><a href=\"assets/tm18_2_2-06_multiscale.png\" target=\"_blank\" rel=\"noopener\"><img src=\"assets/tm18_2_2-06_multiscale.png\" width=\"512\" height=\"512\" alt=\"06 · CA 69.2 %: tm18_2_2.png\"><\/a><figcaption>06 · CA 69.2 %<\/figcaption><\/figure><figure><a href=\"assets/tm18_2_2-07_multiscale_vote.png\" target=\"_blank\" rel=\"noopener\"><img src=\"assets/tm18_2_2-07_multiscale_vote.png\" width=\"512\" height=\"512\" alt=\"07 · CA 70.3 %: tm18_2_2.png\"><\/a><figcaption>07 · CA 70.3 %<\/figcaption><\/figure><\/div><p><strong>Průměr 80 obrázků:<\/strong> 06: CS 21.62 %, CA 50.46 %; 07: CS 22.20 %, CA 51.02 %<\/p><\/div><\/div>"], ["08–09 · Směrové změny jasu", "<div class=\"columns\"><div><pre><code>Image light = channel(lab, 0);\nImage energy = gradientEnergy(light);\nfeat = concat({feat, energy});\nstandardize(feat, sample);\n\n// gradientEnergy uses Sobel / 8 in x and y,\n// then sqrt(blur(dx*dx, 5)) and sqrt(blur(dy*dy, 5)).\n// Method 09 also applies vote(..., 3).<\/code><\/pre><p>K 12 příznakům varianty 06 přidáme dvě lokální energie gradientu. Následuje standardizace. Varianta 08 nemá hlasování, 09 jej přidává. <strong>Férová srovnání:<\/strong> 06 s 08 pro příznaky, 08 s 09 pro hlasování.<\/p><\/div><div><div class=\"images\"><figure><a href=\"assets/tm18_2_2-source.png\" target=\"_blank\" rel=\"noopener\"><img src=\"assets/tm18_2_2-source.png\" width=\"512\" height=\"512\" alt=\"Vstup: tm18_2_2.png\"><\/a><figcaption>Vstup<\/figcaption><\/figure><figure><a href=\"assets/tm18_2_2-ground_truth.png\" target=\"_blank\" rel=\"noopener\"><img src=\"assets/tm18_2_2-ground_truth.png\" width=\"512\" height=\"512\" alt=\"GT: tm18_2_2.png\"><\/a><figcaption>GT<\/figcaption><\/figure><figure><a href=\"assets/tm18_2_2-08_gradients.png\" target=\"_blank\" rel=\"noopener\"><img src=\"assets/tm18_2_2-08_gradients.png\" width=\"512\" height=\"512\" alt=\"08 · CA 69.0 %: tm18_2_2.png\"><\/a><figcaption>08 · CA 69.0 %<\/figcaption><\/figure><figure><a href=\"assets/tm18_2_2-09_gradients_vote.png\" target=\"_blank\" rel=\"noopener\"><img src=\"assets/tm18_2_2-09_gradients_vote.png\" width=\"512\" height=\"512\" alt=\"09 · CA 70.4 %: tm18_2_2.png\"><\/a><figcaption>09 · CA 70.4 %<\/figcaption><\/figure><\/div><p><strong>Průměr 80 obrázků:<\/strong> 08: CS 22.05 %, CA 50.50 %; 09: CS 22.37 %, CA 51.09 %<\/p><\/div><\/div>"], ["Výsledky všech variant", "<table><thead><tr><th>Varianta<\/th><th>CS % ↑<\/th><th>CA % ↑<\/th><th>OS % ↓<\/th><th>US % ↓<\/th><th>ARI ↑<\/th><th>VI bit ↓<\/th><\/tr><\/thead><tbody><tr><th>00_R_pixel<\/th><td>1.34<\/td><td>24.14<\/td><td>0.00<\/td><td>1.04<\/td><td>0.136<\/td><td>4.047<\/td><\/tr><tr><th>01_R_blur<\/th><td>2.10<\/td><td>27.83<\/td><td>1.68<\/td><td>0.75<\/td><td>0.179<\/td><td>3.743<\/td><\/tr><tr><th>02_RGB_blur<\/th><td>9.02<\/td><td>35.85<\/td><td>3.94<\/td><td>1.32<\/td><td>0.279<\/td><td>3.162<\/td><\/tr><tr><th>03_Lab_blur<\/th><td>18.17<\/td><td>45.00<\/td><td>7.15<\/td><td>3.07<\/td><td>0.392<\/td><td>2.512<\/td><\/tr><tr><th>04_Lab_std<\/th><td>18.55<\/td><td>47.00<\/td><td>7.55<\/td><td>4.18<\/td><td>0.422<\/td><td>2.376<\/td><\/tr><tr><th>05_Lab_std_scaled<\/th><td>19.78<\/td><td>47.97<\/td><td>8.01<\/td><td>7.51<\/td><td>0.446<\/td><td>2.321<\/td><\/tr><tr><th>06_multiscale<\/th><td>21.62<\/td><td>50.46<\/td><td>9.55<\/td><td>7.31<\/td><td>0.479<\/td><td>2.161<\/td><\/tr><tr><th>07_multiscale_vote<\/th><td>22.20<\/td><td>51.02<\/td><td>9.76<\/td><td>7.96<\/td><td>0.487<\/td><td>2.110<\/td><\/tr><tr><th>08_gradients<\/th><td>22.05<\/td><td>50.50<\/td><td>8.45<\/td><td>6.05<\/td><td>0.479<\/td><td>2.176<\/td><\/tr><tr><th>09_gradients_vote<\/th><td>22.37<\/td><td>51.09<\/td><td>8.40<\/td><td>6.74<\/td><td>0.487<\/td><td>2.124<\/td><\/tr><\/tbody><\/table><p><small>Průměr přes 80 obrázků. CS počítá průniky s oboustranným pokrytím alespoň 75 %. CA je průměr IoU vážený plochou GT po párování tříd s maximálním průnikem. OS / US značí přerozdělení / sloučení oblastí a mohou být nulové i u špatné segmentace. ARI je shoda dvojic pixelů s korekcí na náhodu. VI je informační rozdíl rozdělení.<\/small><\/p>"], ["Složitější metoda nemusí pomoci", "<div class=\"images\"><figure><a href=\"assets/tm2_2_2-source.png\" target=\"_blank\" rel=\"noopener\"><img src=\"assets/tm2_2_2-source.png\" width=\"512\" height=\"512\" alt=\"tm2_2_2: tm2_2_2.png\"><\/a><figcaption>tm2_2_2<\/figcaption><\/figure><figure><a href=\"assets/tm2_2_2-ground_truth.png\" target=\"_blank\" rel=\"noopener\"><img src=\"assets/tm2_2_2-ground_truth.png\" width=\"512\" height=\"512\" alt=\"GT: tm2_2_2.png\"><\/a><figcaption>GT<\/figcaption><\/figure><figure><a href=\"assets/tm2_2_2-04_Lab_std.png\" target=\"_blank\" rel=\"noopener\"><img src=\"assets/tm2_2_2-04_Lab_std.png\" width=\"512\" height=\"512\" alt=\"04 · CS 74.87 %: tm2_2_2.png\"><\/a><figcaption>04 · CS 74.87 %<\/figcaption><\/figure><figure><a href=\"assets/tm2_2_2-05_Lab_std_scaled.png\" target=\"_blank\" rel=\"noopener\"><img src=\"assets/tm2_2_2-05_Lab_std_scaled.png\" width=\"512\" height=\"512\" alt=\"05 · CS 0.00 %: tm2_2_2.png\"><\/a><figcaption>05 · CS 0.00 %<\/figcaption><\/figure><\/div><p><strong>Standardizace 04 → 05:<\/strong> na vývojových 16 obrázcích CS klesá z 12.56 % na 9.87 %, přestože celkový průměr roste. Nahoře je výrazný konkrétní neúspěch.<\/p><p><small>Skupiny 1, 6, 11, 16 tvoří vývojovou sadu, ostatních 64 obrázků odkládáme. Varianty i parametry byly pevné před prvním skórováním. Vývojové CS i CA postupně rostou pouze v řadě 00–04. Textury se mohou opakovat, proto nejde o nezávislý test nových textur.<\/small><\/p>"], ["Vlastní pokus", "<pre><code># Linux / macOS (GCC or Clang)\ng++ -O2 -std=c++17 segment.cpp -o segment\n./segment input.png seg.png 6 4\n\n# Windows: run build-msvc.cmd, then\n.\\segment.exe input.png seg.png 6 4<\/code><\/pre><p>Měňte jeden příznak nebo parametr. Předem napište předpoklad a porovnejte rodičovskou variantu, včetně zhoršených obrázků. Čtvrtý argument programu je metoda 0–9, třetí známé K.<\/p><p><a href=\"source.zip\" download>C++ zdrojový projekt ZIP<\/a> · <a href=\"segment.cpp\" download>segment.cpp<\/a> · <a href=\"summary.csv\" download>Výsledky CSV<\/a> · <a href=\"offline.zip\" download>Prezentace offline<\/a> · <a href=\"https://roz-mosaic.richtrad.chatgpt.site\">Mosaic: vyhodnocení<\/a><\/p><p><small>ZIP obsahuje CMakeLists.txt, sestavení pro MSVC a obě hlavičky stb včetně licencí. Výstupem je PNG s ID tříd. GT nepoužíváme při segmentaci. Náhledy a všech 800 výsledků vznikly z tohoto C++ zdroje.<\/small><\/p>"]], "en": [["Mosaic segmentation step by step", "<p>A short demonstration of feature design and basic segmentation methods.<\/p><div class=\"images\"><figure><a href=\"assets/tm18_2_2-source.png\" target=\"_blank\" rel=\"noopener\"><img src=\"assets/tm18_2_2-source.png\" width=\"512\" height=\"512\" alt=\"Input image: tm18_2_2.png\"><\/a><figcaption>Input image<\/figcaption><\/figure><figure><a href=\"assets/tm18_2_2-ground_truth.png\" target=\"_blank\" rel=\"noopener\"><img src=\"assets/tm18_2_2-ground_truth.png\" width=\"512\" height=\"512\" alt=\"Ground truth (GT): tm18_2_2.png\"><\/a><figcaption>Ground truth (GT)<\/figcaption><\/figure><figure><a href=\"assets/tm18_2_2-09_gradients_vote.png\" target=\"_blank\" rel=\"noopener\"><img src=\"assets/tm18_2_2-09_gradients_vote.png\" width=\"512\" height=\"512\" alt=\"Method 09 output: tm18_2_2.png\"><\/a><figcaption>Method 09 output<\/figcaption><\/figure><\/div><p>C++17, K-means and 10 variants. The same image at each step, code and measured results.<\/p><p><small>ROZ · GRAFIT · 12 November 2026. Illustrative mosaic tm18_2_2, K = 6. Chosen for a clear demonstration, not as an average case.<\/small><\/p>"], ["Shared baseline: K-means", "<div class=\"columns\"><div><pre><code>Image rgb = readRGB(&quot;input.png&quot;);\nImage feat = features(rgb, 4);\nstd::mt19937 rng(20261112);\nauto sample = samplePixels(\n    rgb.w * rgb.h, 8192, rng);\nauto centers = fitKmeans(\n    feat, sample, k, rng, 5, 100);\nauto labels = predict(feat, centers, k);<\/code><\/pre><\/div><div><p>Each pixel has a feature vector <code>feat(y, x, c)<\/code>. K-means finds K centres and assigns each pixel to the nearest one.<\/p><p>We fit centres on 8,192 pixels and classify all 512 × 512 pixels. Every variant uses the same seed and five initialisations.<\/p><p><strong>Input:<\/strong> RGB and the known K supplied by the assignment. GT is only used for evaluation and consistent visualisation colours.<\/p><p><small>Standalone C++17 and the standard library. Bundled stb reads and writes PNG. Image and the helper functions are in segment.cpp. All images and scores were recomputed with this implementation.<\/small><\/p><\/div><\/div>"], ["00 · Red channel only", "<div class=\"columns\"><div><pre><code>// readRGB converts bytes to float values in [0, 1].\nImage feat = channel(rgb, 0);  // 0 = R, 1 = G, 2 = B<\/code><\/pre><p>One pixel, one R value. The method cannot see green, blue or neighbouring pixels. Similar red values may belong to different textures. <strong>Question:<\/strong> which regions merge?<\/p><\/div><div><div class=\"images\"><figure><a href=\"assets/tm18_2_2-source.png\" target=\"_blank\" rel=\"noopener\"><img src=\"assets/tm18_2_2-source.png\" width=\"512\" height=\"512\" alt=\"Input: tm18_2_2.png\"><\/a><figcaption>Input<\/figcaption><\/figure><figure><a href=\"assets/tm18_2_2-ground_truth.png\" target=\"_blank\" rel=\"noopener\"><img src=\"assets/tm18_2_2-ground_truth.png\" width=\"512\" height=\"512\" alt=\"GT: tm18_2_2.png\"><\/a><figcaption>GT<\/figcaption><\/figure><figure><a href=\"assets/tm18_2_2-00_R_pixel.png\" target=\"_blank\" rel=\"noopener\"><img src=\"assets/tm18_2_2-00_R_pixel.png\" width=\"512\" height=\"512\" alt=\"00 · CA 24.7 %: tm18_2_2.png\"><\/a><figcaption>00 · CA 24.7 %<\/figcaption><\/figure><\/div><p><strong>Mean over 80 images:<\/strong> 00: CS 1.34 %, CA 24.14 %<\/p><\/div><\/div>"], ["01 · Gaussian smoothing", "<div class=\"columns\"><div><pre><code>Image feat = blur(channel(rgb, 0), 5.0f);\n\n// Gaussian weights inside blur():\nint r = int(3 * sigma + 0.5f);\nfor (int i = -r; i &lt;= r; ++i)\n    kernel[i + r] = std::exp(-i*i / (2*sigma*sigma));\n// Normalise weights, filter rows and columns.<\/code><\/pre><p>Gaussian weights average the neighbourhood, σ = 5 pixels. Two spatial passes filter each channel independently. Fine texture variations decrease, but boundaries also become blurred.<\/p><\/div><div><div class=\"images\"><figure><a href=\"assets/tm18_2_2-source.png\" target=\"_blank\" rel=\"noopener\"><img src=\"assets/tm18_2_2-source.png\" width=\"512\" height=\"512\" alt=\"Input: tm18_2_2.png\"><\/a><figcaption>Input<\/figcaption><\/figure><figure><a href=\"assets/tm18_2_2-ground_truth.png\" target=\"_blank\" rel=\"noopener\"><img src=\"assets/tm18_2_2-ground_truth.png\" width=\"512\" height=\"512\" alt=\"GT: tm18_2_2.png\"><\/a><figcaption>GT<\/figcaption><\/figure><figure><a href=\"assets/tm18_2_2-00_R_pixel.png\" target=\"_blank\" rel=\"noopener\"><img src=\"assets/tm18_2_2-00_R_pixel.png\" width=\"512\" height=\"512\" alt=\"00 · CA 24.7 %: tm18_2_2.png\"><\/a><figcaption>00 · CA 24.7 %<\/figcaption><\/figure><figure><a href=\"assets/tm18_2_2-01_R_blur.png\" target=\"_blank\" rel=\"noopener\"><img src=\"assets/tm18_2_2-01_R_blur.png\" width=\"512\" height=\"512\" alt=\"01 · CA 30.8 %: tm18_2_2.png\"><\/a><figcaption>01 · CA 30.8 %<\/figcaption><\/figure><\/div><p><strong>Mean over 80 images:<\/strong> 00: CS 1.34 %, CA 24.14 %; 01: CS 2.10 %, CA 27.83 %<\/p><\/div><\/div>"], ["02–03 · RGB and CIELAB", "<div class=\"columns\"><div><pre><code>// 02: three colour channels\nImage feat = blur(rgb, 5);\n\n// 03: D65 Lab, all coordinates divided by 100\nImage lab = toLab(rgb);\nfeat = blur(lab, 5);<\/code><\/pre><p>RGB provides three features instead of one. CIELAB changes the geometry of colour distances and separates L* lightness from a*, b*. Both variants use three features and the same blur.<\/p><\/div><div><div class=\"images\"><figure><a href=\"assets/tm18_2_2-source.png\" target=\"_blank\" rel=\"noopener\"><img src=\"assets/tm18_2_2-source.png\" width=\"512\" height=\"512\" alt=\"Input: tm18_2_2.png\"><\/a><figcaption>Input<\/figcaption><\/figure><figure><a href=\"assets/tm18_2_2-ground_truth.png\" target=\"_blank\" rel=\"noopener\"><img src=\"assets/tm18_2_2-ground_truth.png\" width=\"512\" height=\"512\" alt=\"GT: tm18_2_2.png\"><\/a><figcaption>GT<\/figcaption><\/figure><figure><a href=\"assets/tm18_2_2-02_RGB_blur.png\" target=\"_blank\" rel=\"noopener\"><img src=\"assets/tm18_2_2-02_RGB_blur.png\" width=\"512\" height=\"512\" alt=\"02 · CA 42.1 %: tm18_2_2.png\"><\/a><figcaption>02 · CA 42.1 %<\/figcaption><\/figure><figure><a href=\"assets/tm18_2_2-03_Lab_blur.png\" target=\"_blank\" rel=\"noopener\"><img src=\"assets/tm18_2_2-03_Lab_blur.png\" width=\"512\" height=\"512\" alt=\"03 · CA 57.2 %: tm18_2_2.png\"><\/a><figcaption>03 · CA 57.2 %<\/figcaption><\/figure><\/div><p><strong>Mean over 80 images:<\/strong> 02: CS 9.02 %, CA 35.85 %; 03: CS 18.17 %, CA 45.00 %<\/p><\/div><\/div>"], ["04 · Local mean and deviation", "<div class=\"columns\"><div><pre><code>Image mean = blur(a, sigma), square = a;\nfor (float&amp; v : square.data) v *= v;\nImage deviation = blur(square, sigma);\nfor (size_t i = 0; i &lt; a.data.size(); ++i) {\n    float variance = deviation.data[i]\n                   - mean.data[i] * mean.data[i];\n    deviation.data[i] = std::sqrt(\n        std::max(variance, 0.0f));\n}\nreturn concat({mean, deviation});<\/code><\/pre><p>Three means describe colour, three deviations describe local variation: 6 features. <code>std::max(variance, 0.0f)<\/code> removes negative variance caused by rounding. The same average colour need not imply the same texture.<\/p><\/div><div><div class=\"images\"><figure><a href=\"assets/tm18_2_2-source.png\" target=\"_blank\" rel=\"noopener\"><img src=\"assets/tm18_2_2-source.png\" width=\"512\" height=\"512\" alt=\"Input: tm18_2_2.png\"><\/a><figcaption>Input<\/figcaption><\/figure><figure><a href=\"assets/tm18_2_2-ground_truth.png\" target=\"_blank\" rel=\"noopener\"><img src=\"assets/tm18_2_2-ground_truth.png\" width=\"512\" height=\"512\" alt=\"GT: tm18_2_2.png\"><\/a><figcaption>GT<\/figcaption><\/figure><figure><a href=\"assets/tm18_2_2-03_Lab_blur.png\" target=\"_blank\" rel=\"noopener\"><img src=\"assets/tm18_2_2-03_Lab_blur.png\" width=\"512\" height=\"512\" alt=\"03 · CA 57.2 %: tm18_2_2.png\"><\/a><figcaption>03 · CA 57.2 %<\/figcaption><\/figure><figure><a href=\"assets/tm18_2_2-04_Lab_std.png\" target=\"_blank\" rel=\"noopener\"><img src=\"assets/tm18_2_2-04_Lab_std.png\" width=\"512\" height=\"512\" alt=\"04 · CA 60.7 %: tm18_2_2.png\"><\/a><figcaption>04 · CA 60.7 %<\/figcaption><\/figure><\/div><p><strong>Mean over 80 images:<\/strong> 03: CS 18.17 %, CA 45.00 %; 04: CS 18.55 %, CA 47.00 %<\/p><\/div><\/div>"], ["05 · Feature standardisation", "<div class=\"columns\"><div><pre><code>// Estimate mean and variance on the sampled pixels.\n// Apply this transformation to every pixel, channel c:\ndouble scale = std::max(\n    std::sqrt(var / sample.size()), 0.01);\nfor (size_t i = c; i &lt; feat.data.size();\n     i += feat.channels)\n    feat.data[i] = float((feat.data[i] - mean) / scale);\n\n// Full helper call before fitting K-means:\nstandardize(feat, sample);<\/code><\/pre><p>Features receive comparable scales in Euclidean distance. We estimate means and deviations from the input image sample without GT. This can also amplify less useful features.<\/p><\/div><div><div class=\"images\"><figure><a href=\"assets/tm18_2_2-source.png\" target=\"_blank\" rel=\"noopener\"><img src=\"assets/tm18_2_2-source.png\" width=\"512\" height=\"512\" alt=\"Input: tm18_2_2.png\"><\/a><figcaption>Input<\/figcaption><\/figure><figure><a href=\"assets/tm18_2_2-ground_truth.png\" target=\"_blank\" rel=\"noopener\"><img src=\"assets/tm18_2_2-ground_truth.png\" width=\"512\" height=\"512\" alt=\"GT: tm18_2_2.png\"><\/a><figcaption>GT<\/figcaption><\/figure><figure><a href=\"assets/tm18_2_2-04_Lab_std.png\" target=\"_blank\" rel=\"noopener\"><img src=\"assets/tm18_2_2-04_Lab_std.png\" width=\"512\" height=\"512\" alt=\"04 · CA 60.7 %: tm18_2_2.png\"><\/a><figcaption>04 · CA 60.7 %<\/figcaption><\/figure><figure><a href=\"assets/tm18_2_2-05_Lab_std_scaled.png\" target=\"_blank\" rel=\"noopener\"><img src=\"assets/tm18_2_2-05_Lab_std_scaled.png\" width=\"512\" height=\"512\" alt=\"05 · CA 66.4 %: tm18_2_2.png\"><\/a><figcaption>05 · CA 66.4 %<\/figcaption><\/figure><\/div><p><strong>Mean over 80 images:<\/strong> 04: CS 18.55 %, CA 47.00 %; 05: CS 19.78 %, CA 47.97 %<\/p><\/div><\/div>"], ["06 · Two neighbourhood scales", "<div class=\"columns\"><div><pre><code>Image feat = concat({\n    localStats(lab, 3),\n    localStats(lab, 9)\n});\nstandardize(feat, sample);<\/code><\/pre><p>Six statistics at σ = 3 and six at σ = 9 give 12 features. Small neighbourhoods capture finer structure, larger ones more stable texture properties. The cost is more computation and wider transitions near boundaries.<\/p><\/div><div><div class=\"images\"><figure><a href=\"assets/tm18_2_2-source.png\" target=\"_blank\" rel=\"noopener\"><img src=\"assets/tm18_2_2-source.png\" width=\"512\" height=\"512\" alt=\"Input: tm18_2_2.png\"><\/a><figcaption>Input<\/figcaption><\/figure><figure><a href=\"assets/tm18_2_2-ground_truth.png\" target=\"_blank\" rel=\"noopener\"><img src=\"assets/tm18_2_2-ground_truth.png\" width=\"512\" height=\"512\" alt=\"GT: tm18_2_2.png\"><\/a><figcaption>GT<\/figcaption><\/figure><figure><a href=\"assets/tm18_2_2-05_Lab_std_scaled.png\" target=\"_blank\" rel=\"noopener\"><img src=\"assets/tm18_2_2-05_Lab_std_scaled.png\" width=\"512\" height=\"512\" alt=\"05 · CA 66.4 %: tm18_2_2.png\"><\/a><figcaption>05 · CA 66.4 %<\/figcaption><\/figure><figure><a href=\"assets/tm18_2_2-06_multiscale.png\" target=\"_blank\" rel=\"noopener\"><img src=\"assets/tm18_2_2-06_multiscale.png\" width=\"512\" height=\"512\" alt=\"06 · CA 69.2 %: tm18_2_2.png\"><\/a><figcaption>06 · CA 69.2 %<\/figcaption><\/figure><\/div><p><strong>Mean over 80 images:<\/strong> 05: CS 19.78 %, CA 47.97 %; 06: CS 21.62 %, CA 50.46 %<\/p><\/div><\/div>"], ["07 · Neighbourhood voting", "<div class=\"columns\"><div><pre><code>// Inside vote(): one binary mask per class c.\nImage mask(w, h, 1);\nfor (size_t i = 0; i &lt; labels.size(); ++i)\n    mask.data[i] = labels[i] == c ? 1.0f : 0.0f;\nImage support = blur(mask, 3);\n// At each pixel, keep the class with maximum support.\n\nlabels = vote(labels, rgb.w, rgb.h, k, 3);<\/code><\/pre><p>Each class votes through its binary mask, σ = 3. The greatest local support wins. Class IDs have no numeric order, so averaging them is meaningless. Voting may remove small islands as well as correct thin regions.<\/p><\/div><div><div class=\"images\"><figure><a href=\"assets/tm18_2_2-source.png\" target=\"_blank\" rel=\"noopener\"><img src=\"assets/tm18_2_2-source.png\" width=\"512\" height=\"512\" alt=\"Input: tm18_2_2.png\"><\/a><figcaption>Input<\/figcaption><\/figure><figure><a href=\"assets/tm18_2_2-ground_truth.png\" target=\"_blank\" rel=\"noopener\"><img src=\"assets/tm18_2_2-ground_truth.png\" width=\"512\" height=\"512\" alt=\"GT: tm18_2_2.png\"><\/a><figcaption>GT<\/figcaption><\/figure><figure><a href=\"assets/tm18_2_2-06_multiscale.png\" target=\"_blank\" rel=\"noopener\"><img src=\"assets/tm18_2_2-06_multiscale.png\" width=\"512\" height=\"512\" alt=\"06 · CA 69.2 %: tm18_2_2.png\"><\/a><figcaption>06 · CA 69.2 %<\/figcaption><\/figure><figure><a href=\"assets/tm18_2_2-07_multiscale_vote.png\" target=\"_blank\" rel=\"noopener\"><img src=\"assets/tm18_2_2-07_multiscale_vote.png\" width=\"512\" height=\"512\" alt=\"07 · CA 70.3 %: tm18_2_2.png\"><\/a><figcaption>07 · CA 70.3 %<\/figcaption><\/figure><\/div><p><strong>Mean over 80 images:<\/strong> 06: CS 21.62 %, CA 50.46 %; 07: CS 22.20 %, CA 51.02 %<\/p><\/div><\/div>"], ["08–09 · Directional lightness changes", "<div class=\"columns\"><div><pre><code>Image light = channel(lab, 0);\nImage energy = gradientEnergy(light);\nfeat = concat({feat, energy});\nstandardize(feat, sample);\n\n// gradientEnergy uses Sobel / 8 in x and y,\n// then sqrt(blur(dx*dx, 5)) and sqrt(blur(dy*dy, 5)).\n// Method 09 also applies vote(..., 3).<\/code><\/pre><p>We add two local gradient energies to the 12 features of method 06, then standardise. Method 08 has no voting, method 09 adds it. <strong>Controlled comparisons:<\/strong> 06 vs 08 for features, 08 vs 09 for voting.<\/p><\/div><div><div class=\"images\"><figure><a href=\"assets/tm18_2_2-source.png\" target=\"_blank\" rel=\"noopener\"><img src=\"assets/tm18_2_2-source.png\" width=\"512\" height=\"512\" alt=\"Input: tm18_2_2.png\"><\/a><figcaption>Input<\/figcaption><\/figure><figure><a href=\"assets/tm18_2_2-ground_truth.png\" target=\"_blank\" rel=\"noopener\"><img src=\"assets/tm18_2_2-ground_truth.png\" width=\"512\" height=\"512\" alt=\"GT: tm18_2_2.png\"><\/a><figcaption>GT<\/figcaption><\/figure><figure><a href=\"assets/tm18_2_2-08_gradients.png\" target=\"_blank\" rel=\"noopener\"><img src=\"assets/tm18_2_2-08_gradients.png\" width=\"512\" height=\"512\" alt=\"08 · CA 69.0 %: tm18_2_2.png\"><\/a><figcaption>08 · CA 69.0 %<\/figcaption><\/figure><figure><a href=\"assets/tm18_2_2-09_gradients_vote.png\" target=\"_blank\" rel=\"noopener\"><img src=\"assets/tm18_2_2-09_gradients_vote.png\" width=\"512\" height=\"512\" alt=\"09 · CA 70.4 %: tm18_2_2.png\"><\/a><figcaption>09 · CA 70.4 %<\/figcaption><\/figure><\/div><p><strong>Mean over 80 images:<\/strong> 08: CS 22.05 %, CA 50.50 %; 09: CS 22.37 %, CA 51.09 %<\/p><\/div><\/div>"], ["Results of all variants", "<table><thead><tr><th>Variant<\/th><th>CS % ↑<\/th><th>CA % ↑<\/th><th>OS % ↓<\/th><th>US % ↓<\/th><th>ARI ↑<\/th><th>VI bits ↓<\/th><\/tr><\/thead><tbody><tr><th>00_R_pixel<\/th><td>1.34<\/td><td>24.14<\/td><td>0.00<\/td><td>1.04<\/td><td>0.136<\/td><td>4.047<\/td><\/tr><tr><th>01_R_blur<\/th><td>2.10<\/td><td>27.83<\/td><td>1.68<\/td><td>0.75<\/td><td>0.179<\/td><td>3.743<\/td><\/tr><tr><th>02_RGB_blur<\/th><td>9.02<\/td><td>35.85<\/td><td>3.94<\/td><td>1.32<\/td><td>0.279<\/td><td>3.162<\/td><\/tr><tr><th>03_Lab_blur<\/th><td>18.17<\/td><td>45.00<\/td><td>7.15<\/td><td>3.07<\/td><td>0.392<\/td><td>2.512<\/td><\/tr><tr><th>04_Lab_std<\/th><td>18.55<\/td><td>47.00<\/td><td>7.55<\/td><td>4.18<\/td><td>0.422<\/td><td>2.376<\/td><\/tr><tr><th>05_Lab_std_scaled<\/th><td>19.78<\/td><td>47.97<\/td><td>8.01<\/td><td>7.51<\/td><td>0.446<\/td><td>2.321<\/td><\/tr><tr><th>06_multiscale<\/th><td>21.62<\/td><td>50.46<\/td><td>9.55<\/td><td>7.31<\/td><td>0.479<\/td><td>2.161<\/td><\/tr><tr><th>07_multiscale_vote<\/th><td>22.20<\/td><td>51.02<\/td><td>9.76<\/td><td>7.96<\/td><td>0.487<\/td><td>2.110<\/td><\/tr><tr><th>08_gradients<\/th><td>22.05<\/td><td>50.50<\/td><td>8.45<\/td><td>6.05<\/td><td>0.479<\/td><td>2.176<\/td><\/tr><tr><th>09_gradients_vote<\/th><td>22.37<\/td><td>51.09<\/td><td>8.40<\/td><td>6.74<\/td><td>0.487<\/td><td>2.124<\/td><\/tr><\/tbody><\/table><p><small>Means over 80 images. CS counts intersections covering at least 75% of both regions. CA is GT-area-weighted IoU after maximum-overlap class matching. OS / US capture region splitting / merging and can be zero even for poor segmentations. ARI is chance-adjusted pair agreement. VI is the information difference between partitions.<\/small><\/p>"], ["A more complex method may fail", "<div class=\"images\"><figure><a href=\"assets/tm2_2_2-source.png\" target=\"_blank\" rel=\"noopener\"><img src=\"assets/tm2_2_2-source.png\" width=\"512\" height=\"512\" alt=\"tm2_2_2: tm2_2_2.png\"><\/a><figcaption>tm2_2_2<\/figcaption><\/figure><figure><a href=\"assets/tm2_2_2-ground_truth.png\" target=\"_blank\" rel=\"noopener\"><img src=\"assets/tm2_2_2-ground_truth.png\" width=\"512\" height=\"512\" alt=\"GT: tm2_2_2.png\"><\/a><figcaption>GT<\/figcaption><\/figure><figure><a href=\"assets/tm2_2_2-04_Lab_std.png\" target=\"_blank\" rel=\"noopener\"><img src=\"assets/tm2_2_2-04_Lab_std.png\" width=\"512\" height=\"512\" alt=\"04 · CS 74.87 %: tm2_2_2.png\"><\/a><figcaption>04 · CS 74.87 %<\/figcaption><\/figure><figure><a href=\"assets/tm2_2_2-05_Lab_std_scaled.png\" target=\"_blank\" rel=\"noopener\"><img src=\"assets/tm2_2_2-05_Lab_std_scaled.png\" width=\"512\" height=\"512\" alt=\"05 · CS 0.00 %: tm2_2_2.png\"><\/a><figcaption>05 · CS 0.00 %<\/figcaption><\/figure><\/div><p><strong>Standardisation 04 → 05:<\/strong> on 16 development images, CS drops from 12.56% to 9.87%, although the overall mean increases. Above is a clear individual failure.<\/p><p><small>Groups 1, 6, 11, 16 form the development set. The other 64 images are held out. Variants and parameters were fixed before scoring. Both development CS and CA improve along 00–04. Textures may recur, so this is not an independent test of unseen textures.<\/small><\/p>"], ["Your own experiment", "<pre><code># Linux / macOS (GCC or Clang)\ng++ -O2 -std=c++17 segment.cpp -o segment\n./segment input.png seg.png 6 4\n\n# Windows: run build-msvc.cmd, then\n.\\segment.exe input.png seg.png 6 4<\/code><\/pre><p>Change one feature or parameter. State a hypothesis first and compare with the parent variant, including worse images. The fourth argument selects method 0–9, the third is known K.<\/p><p><a href=\"source.zip\" download>C++ source project ZIP<\/a> · <a href=\"segment.cpp\" download>segment.cpp<\/a> · <a href=\"summary.csv\" download>Results CSV<\/a> · <a href=\"offline.zip\" download>Offline slides<\/a> · <a href=\"https://roz-mosaic.richtrad.chatgpt.site\">Mosaic evaluator<\/a><\/p><p><small>The ZIP includes CMakeLists.txt, an MSVC build script and both stb headers with their licences. Output is a PNG of class IDs. Segmentation never uses GT. All previews and 800 results were generated from this C++ source.<\/small><\/p>"]]}</script><script src="slides.js"></script></body></html>
