<!doctype html><html lang="cs"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Naruto — animace postavy</title><style>body{margin:0;background:#152a36;color:#ffdda3;font:16px system-ui;padding:24px}a{color:#8ce5db}header{max-width:1150px;margin:auto}button{background:#f5ad5a;color:#182f3b;border:0;border-radius:6px;padding:10px 18px;font:inherit;cursor:pointer;margin:12px 8px 12px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;max-width:1150px;margin:auto}article{background:#213b48;border:1px solid #47616a;border-radius:12px;padding:12px}h2{font-size:16px;margin:0}canvas{display:block;width:100%;height:auto;image-rendering:pixelated}p{color:#c1d1d1}</style><header><a href="./">← Zpět do tréninku</a><h1>16 akcí · 64 snímků</h1><p>Generované pixelart animace použité ve hře. Všechny pózy sdílejí stejný atlas.</p><button id="pause">Pozastavit</button><button id="flip">Otočit doleva</button></header><main class="grid" id="grid"></main><script src="atlas.js"></script><script src="animation.js"></script><script>
const labels=['Postoj','Běh','Příprava skoku','První skok','Dvojskok','Pád','Chakra dash','Skluz','Držení u stěny','Wall jump','Dopad','Smyk','Zásah','Poražen','Vítězství','Výjezd ze skluzu'];const names=['idle','run','crouch','jump','double','fall','dash','slide','wallGrip','wallJump','land','skid','hit','dead','won','slideExit'];let face=1,paused=false,time=0,last=0;const img=new Image();img.src='assets/naruto-actions-v9.png';const anim=new NinjaAnimator(NINJA_ATLAS,img);const contexts=labels.map(label=>{const article=document.createElement('article'),h=document.createElement('h2'),c=document.createElement('canvas');h.textContent=label;c.width=300;c.height=190;article.append(h,c);document.getElementById('grid').append(article);return c.getContext('2d')});document.getElementById('pause').onclick=e=>{paused=!paused;e.target.textContent=paused?'Přehrát':'Pozastavit'};document.getElementById('flip').onclick=e=>{face=-face;e.target.textContent=face===1?'Otočit doleva':'Otočit doprava'};function draw(t){if(!paused)time+=Math.min(.05,(t-last)/1000||0);last=t;contexts.forEach((ctx,i)=>{ctx.clearRect(0,0,300,190);ctx.strokeStyle='#517078';ctx.beginPath();ctx.moveTo(10,160);ctx.lineTo(290,160);ctx.stroke();ctx.save();ctx.translate(150,160);ctx.scale(2.5,2.5);anim.draw(ctx,0,0,face,1,{action:names[i],frame:i*4+Math.floor(time*7)%4});ctx.restore()});requestAnimationFrame(draw)}requestAnimationFrame(draw);
</script></html>
