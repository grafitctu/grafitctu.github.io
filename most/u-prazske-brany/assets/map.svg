<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 382 378" role="img" aria-labelledby="map-t map-d" class="k-map">
<title id="map-t">U Pražské brány (Am Prager Tor) a okolí podle plánu města 1938 (GIS)</title><desc id="map-d">Půdorysy budov z vektorizace plánu 1938. Zeleně domy modelované v této rekonstrukci (odkazy na jejich stránky), oranžově modelované domy se štítkem hypotézy, světle s přerušovaným obrysem domy, které se ještě modelují, béžově případné nemodelované budovy ulice bez čísla popisného, šedě ostatní budovy. Budovy plynárny bez čp. (GIS 1526–1531) jsou hypotéza stavu kolem 1938. Šířky parcel 449 a 495 jsou v modelu podle stavebních plánů, mapa ukazuje půdorysy GIS.</desc>
