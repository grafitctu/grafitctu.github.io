<title id="map-t">U hřiště (1938 Seligerova) a okolí podle plánu města 1938 (GIS)</title><desc id="map-d">Půdorysy budov z vektorizace plánu 1938. Zeleně domy modelované v této rekonstrukci (odkazy na jejich stránky), oranžově modelované domy se štítkem hypotézy, světle s přerušovaným obrysem domy, které se ještě modelují, béžově budovy ulice bez čísla popisného (areál plynárny, dvůr SHD), šedě ostatní budovy. Čísla jsou podle pramenů: GIS budova 635 je 574 a 634 je 630 (v GIS mají popisky prohozené); 413 a a 413 b jsou hypotéza identity na budovách GIS bez čp.</desc>
