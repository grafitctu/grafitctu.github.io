<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 653 1088" role="img" aria-labelledby="map-t map-d" class="k-map">
<title id="map-t">U náhonu (K jatkám) a Na popravišti s okolím podle plánu města 1938 (GIS)</title><desc id="map-d">Půdorysy budov z vektorizace plánu 1938. Zeleně domy modelované v této rekonstrukci (odkazy na jejich stránky), oranžově modelované domy se štítkem hypotézy nebo stavu epochy, béžově budovy ulice bez modelu (areál jatek, domy bez pramene, zbořené domy), šedě ostatní budovy. Šířky domů 541, 987, 988, 1065 a 1068 a blok stájí 286 jsou v modelu podle plánů a snímků, mapa ukazuje půdorysy GIS; domek 1886 v GIS chybí a je zakreslen podle náčrtu.</desc>
