<title id="map-t">Pařidelská (Paredler Straße) a okolí podle plánu města 1938 (GIS)</title><desc id="map-d">Půdorysy budov z vektorizace plánu 1938. Zeleně domy modelované v této rekonstrukci (odkazy na jejich stránky), oranžově modelované domy se štítkem hypotézy, světle s přerušovaným obrysem domy, které se ještě modelují, béžově případné nemodelované budovy ulice bez čísla popisného, šedě ostatní budovy. Půdorysy vil 426 a 1425 jsou v modelu podle stavebních plánů 1922/1925, mapa ukazuje půdorysy GIS.</desc>
